<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#004C98">
  <title>UC Campus Canteen | Food Ordering</title>
  <style>
    /* ---------------------------------------------------------
       UC Campus Canteen - Simple CSS, no outside libraries
       Colors inspired by the University of Cebu logo.
       --------------------------------------------------------- */
    :root {
      --blue: #004C98;
      --dark-blue: #003E93;
      --cyan: #00C6FE;
      --yellow: #FFF200;
      --background: #F3F5F9;
      --white: #FFFFFF;
      --text: #172033;
      --muted: #64748B;
      --border: #DFE7F1;
      --green: #16804A;
      --red: #C62828;
      --shadow: 0 12px 35px rgba(18, 50, 87, 0.07);
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--text); font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select, textarea { width: 100%; border: 1px solid #CAD5E4; border-radius: 10px; padding: 12px 13px; background: white; color: var(--text); }
    input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid rgba(0, 198, 254, .35); outline-offset: 2px; }
    textarea { min-height: 90px; resize: vertical; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; color: #35445D; }
    p { line-height: 1.55; }
    h1, h2, h3, h4 { line-height: 1.23; }
    h1 { font-size: 29px; margin: 5px 0 10px; letter-spacing: -0.5px; }
    h2 { font-size: 21px; margin: 0; }
    h3 { font-size: 17px; margin: 0; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.7px; text-transform: uppercase; color: var(--blue); }
    .tiny-space { height: 12px; }
    .text-right { text-align: right; }
    .center { text-align: center; }
    .hidden { display: none !important; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 17px; min-height: 43px; border: 1px solid transparent; border-radius: 10px; font-weight: 700; text-decoration: none; transition: background .16s, transform .16s; }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-primary { color: white; background: var(--blue); }
    .btn-primary:hover:not(:disabled) { background: var(--dark-blue); }
    .btn-outline { background: white; color: var(--blue); border-color: #C6D6EA; }
    .btn-outline:hover:not(:disabled) { background: #F0F7FF; }
    .btn-soft { background: #E9F3FF; color: var(--blue); }
    .btn-danger { background: #FFF0F0; color: var(--red); border-color: #FFE0E0; }
    .btn-yellow { color: #172033; background: var(--yellow); }
    .btn-sm { min-height: 34px; padding: 8px 11px; font-size: 12px; border-radius: 8px; }
    .btn-block { width: 100%; }
    .button-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .card { background: white; border: 1px solid #E8EDF4; border-radius: 17px; padding: 21px; box-shadow: var(--shadow); }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 27px 0 16px; }
    .section-head:first-child { margin-top: 0; }
    .empty { background: white; padding: 44px 20px; border: 1px dashed #B9CEE5; border-radius: 16px; text-align: center; }
    .empty .big-icon { font-size: 45px; margin-bottom: 12px; }
    .empty h3 { margin-bottom: 6px; }
    .empty p { color: var(--muted); max-width: 440px; margin: 6px auto 19px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-field { margin-bottom: 16px; }
    .notice { padding: 12px 14px; border: 1px solid #BFDBFE; border-radius: 10px; background: #EFF7FF; color: #164B83; line-height: 1.5; font-size: 13px; }
    .status { display: inline-block; padding: 7px 11px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .status-pending { background: #FFF5D7; color: #795800; }
    .status-preparing { background: #E9F2FF; color: #0055A7; }
    .status-ready { background: #FFF5AE; color: #433B00; }
    .status-completed { background: #DDF6E7; color: #17653F; }
    .status-cancelled { background: #FBE4E4; color: #A72F2F; }
    .divider { height: 1px; background: var(--border); margin: 17px 0; }

    /* Welcome / Sign-in / Registration */
    .auth-page { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .auth-left { background: linear-gradient(145deg, #003E93 0%, #004C98 64%, #0075B5 100%); display: flex; flex-direction: column; justify-content: space-between; padding: 48px clamp(30px, 7vw, 100px); color: white; position: relative; overflow: hidden; }
    .auth-left::before { content: ""; position: absolute; border: 80px solid rgba(0,198,254,.13); border-radius: 50%; width: 440px; height: 440px; right: -290px; top: 13%; }
    .auth-left::after { content: ""; position: absolute; background: var(--yellow); border-radius: 50%; width: 18px; height: 18px; right: 20%; bottom: 24%; }
    .auth-logo-box { display: inline-flex; background: white; border-radius: 13px; padding: 10px 14px; width: 154px; position: relative; }
    .uc-logo { width: 100%; display: block; object-fit: contain; }
    .auth-tag { margin-bottom: 25px; color: #92E7FF; font-size: 12px; letter-spacing: 2px; font-weight: bold; }
    .auth-left h1 { font-size: clamp(35px, 4.5vw, 58px); max-width: 560px; line-height: 1.09; margin-bottom: 20px; }
    .auth-left .subline { max-width: 460px; color: #D7EDFF; font-size: 17px; }
    .auth-features { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 35px; }
    .auth-feature { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); padding: 11px 13px; border-radius: 9px; font-size: 13px; }
    .auth-bottom { color: #D3E8FE; font-size: 12px; position: relative; }
    .auth-right { padding: 38px 24px; display: flex; align-items: center; justify-content: center; }
    .auth-form-wrap { width: 100%; max-width: 430px; }
    .auth-form-wrap h2 { font-size: 29px; margin: 8px 0 9px; }
    .auth-form-wrap .intro { margin: 0 0 25px; color: var(--muted); }
    .auth-form-wrap .btn { margin-top: 3px; }
    .auth-link { border: 0; color: var(--blue); background: transparent; font-weight: 800; padding: 5px; }
    .demo-box { border: 1px solid #D3E1EE; background: #F8FBFF; padding: 16px; border-radius: 12px; margin-top: 21px; }
    .demo-box h4 { margin: 0 0 9px; }
    .demo-buttons { display: flex; gap: 7px; flex-wrap: wrap; }
    .demo-buttons button { flex: 1; }
    .auth-footnote { color: #69788A; font-size: 12px; margin-top: 17px; line-height: 1.6; }

    /* Main application layout */
    .app { display: flex; min-height: 100vh; }
    .sidebar { background: white; border-right: 1px solid var(--border); width: 253px; flex: 0 0 253px; padding: 23px 15px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 9px 21px; border-bottom: 1px solid var(--border); }
    .brand-mark { width: 51px; height: 46px; flex: 0 0 51px; border: 1px solid var(--border); background: white; border-radius: 9px; display: grid; place-items: center; padding: 3px; }
    .brand-name { color: var(--blue); font-weight: 900; letter-spacing: -.4px; font-size: 16px; }
    .brand-sub { display: block; font-size: 11px; font-weight: normal; color: var(--muted); margin-top: 3px; }
    .nav-caption { color: #8090A4; font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 800; margin: 24px 13px 9px; }
    .nav-button { display: flex; width: 100%; align-items: center; gap: 12px; text-align: left; border: 0; background: transparent; padding: 13px 13px; color: #52637C; border-radius: 10px; font-weight: 700; margin: 3px 0; }
    .nav-button .nav-icon { font-size: 18px; width: 22px; text-align: center; }
    .nav-button.active { background: #E8F3FF; color: var(--blue); box-shadow: inset 3px 0 var(--cyan); }
    .nav-button:hover:not(.active) { background: #F4F7FB; color: var(--blue); }
    .nav-count { margin-left: auto; background: var(--yellow); color: #172033; font-weight: 800; border-radius: 8px; padding: 2px 7px; font-size: 11px; }
    .sidebar-bottom { margin-top: auto; padding-top: 18px; }
    .sidebar-user { display: flex; align-items: center; gap: 9px; background: #F5F8FC; padding: 12px 10px; border-radius: 11px; margin-bottom: 7px; }
    .avatar { background: #DBECFF; color: var(--blue); border-radius: 11px; height: 35px; width: 35px; display: grid; place-items: center; font-weight: 900; font-size: 13px; flex: 0 0 35px; }
    .sidebar-user strong { display: block; font-size: 12px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-user small { color: var(--muted); text-transform: capitalize; font-size: 11px; }
    .main { flex: 1; min-width: 0; }
    .topbar { background: rgba(255,255,255,.98); height: 79px; border-bottom: 1px solid var(--border); padding: 0 34px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .topbar h2 { font-size: 18px; }
    .topbar .top-label { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
    .top-right { display: flex; align-items: center; gap: 12px; }
    .role-chip { background: #EDF6FF; color: var(--blue); border: 1px solid #D9E9FA; border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 800; text-transform: capitalize; }
    .top-date { color: var(--muted); font-size: 12px; }
    .hamburger { display: none; background: white; border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px; }
    .overlay { display: none; }
    .content { max-width: 1320px; margin: auto; padding: 29px 34px 70px; }
    .page-intro { margin-bottom: 22px; }
    .page-intro p { margin: 7px 0 0; color: var(--muted); }

    /* Dashboard */
    .hero { background: linear-gradient(115deg, #004C98, #006BAB); border-radius: 19px; color: white; padding: 31px 34px; display: flex; align-items: center; justify-content: space-between; gap: 20px; overflow: hidden; position: relative; }
    .hero::after { content: ""; width: 265px; height: 265px; position: absolute; right: -35px; top: -125px; border: 43px solid rgba(0,198,254,.19); border-radius: 50%; }
    .hero h1 { font-size: clamp(25px, 3vw, 34px); max-width: 510px; }
    .hero p { color: #D2E8FC; margin: 0 0 21px; max-width: 520px; }
    .hero .eyebrow { color: #9BF1FF; }
    .hero-emoji { font-size: 111px; position: relative; z-index: 1; filter: drop-shadow(0 11px 12px rgba(0,0,0,.15)); }
    .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; margin: 18px 0 27px; }
    .stat { border: 1px solid var(--border); background: white; border-radius: 14px; padding: 18px 19px; }
    .stat strong { font-size: 27px; color: var(--blue); display: block; margin-top: 9px; }
    .stat span { font-size: 12px; color: var(--muted); font-weight: 700; }
    .stat-icon { font-size: 20px; float: right; }
    .two-col { display: grid; grid-template-columns: 1.5fr 1fr; gap: 17px; }
    .steps { display: flex; flex-direction: column; gap: 17px; }
    .step { display: flex; gap: 13px; align-items: center; }
    .step-number { height: 36px; width: 36px; flex: 0 0 36px; background: #E9F4FF; color: var(--blue); display: grid; place-items: center; border-radius: 50%; font-weight: 900; }
    .step strong { font-size: 14px; }
    .step p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    /* Food menu */
    .menu-tools { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; align-items: center; margin: 12px 0 17px; }
    .search-box { max-width: 360px; min-width: 220px; flex: 1; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { border: 1px solid #CFDBEA; padding: 9px 13px; background: white; color: #52637C; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .chip.selected { background: var(--blue); color: white; border-color: var(--blue); }
    .food-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; }
    .food-card { border-radius: 16px; overflow: hidden; border: 1px solid #E3EAF3; background: white; box-shadow: var(--shadow); display: flex; flex-direction: column; }
    .food-picture { height: 160px; display: grid; place-items: center; font-size: 77px; position: relative; background: linear-gradient(140deg, #F0F8FF, #DBF2FF); }
    .food-picture.meals { background: linear-gradient(135deg, #E9F5FF, #D6EDFF); }
    .food-picture.snacks { background: linear-gradient(135deg, #FFF8E6, #FFECBA); }
    .food-picture.drinks { background: linear-gradient(135deg, #E7FBFF, #CDF3F9); }
    .food-picture.desserts { background: linear-gradient(135deg, #FFF0F4, #FFE1EC); }
    .food-picture span { filter: drop-shadow(0 6px 4px rgba(0, 0, 0, .11)); }
    .food-tag { position: absolute; top: 12px; left: 12px; background: white; border-radius: 7px; padding: 5px 9px; font-size: 11px; font-weight: 800; color: #516079; }
    .food-info { padding: 17px; flex: 1; display: flex; flex-direction: column; }
    .food-info h3 { font-size: 16px; }
    .food-info p { color: var(--muted); font-size: 12px; margin: 7px 0 16px; line-height: 1.5; flex: 1; }
    .food-card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 7px; }
    .price { font-size: 20px; color: var(--blue); font-weight: 900; white-space: nowrap; }

    /* Cart, checkout, orders and tables */
    .cart-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 18px; align-items: start; }
    .cart-line { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .cart-line:last-child { border-bottom: 0; }
    .line-image { width: 68px; height: 66px; flex: 0 0 68px; display: grid; place-items: center; border-radius: 12px; background: #EEF6FF; font-size: 36px; }
    .line-info { flex: 1; min-width: 0; }
    .line-info h3 { margin-bottom: 4px; }
    .line-info .muted { font-size: 12px; }
    .qty-controls { display: inline-flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 9px; padding: 4px; }
    .qty-controls button { width: 26px; height: 27px; border: 0; border-radius: 6px; background: #EAF4FF; color: var(--blue); font-weight: 900; }
    .qty-controls span { min-width: 14px; text-align: center; font-weight: 800; }
    .line-price { text-align: right; min-width: 90px; }
    .line-price strong { display: block; margin-bottom: 9px; }
    .plain-link { background: none; border: 0; padding: 0; color: var(--red); text-decoration: underline; font-size: 12px; }
    .summary-row { display: flex; justify-content: space-between; margin: 13px 0; gap: 12px; }
    .summary-total { font-size: 19px; font-weight: 900; color: var(--blue); }
    .order-card { padding: 20px; border-radius: 15px; border: 1px solid #E3EAF3; background: white; margin-bottom: 13px; }
    .order-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 13px; }
    .order-head h3 { color: var(--blue); }
    .order-items { margin: 10px 0; color: #52637C; font-size: 13px; line-height: 1.7; }
    .order-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--border); }
    .order-timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 22px; }
    .timeline-step { text-align: center; position: relative; }
    .timeline-step .bubble { display: block; height: 29px; width: 29px; line-height: 29px; border-radius: 50%; background: #E8EDF4; color: #708195; margin: 0 auto 9px; font-size: 12px; font-weight: 900; }
    .timeline-step.done .bubble { background: var(--blue); color: white; }
    .timeline-step .caption { font-size: 10px; color: var(--muted); }
    .timeline-step.done .caption { color: var(--blue); font-weight: 800; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 13px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    th { color: #6A7B90; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
    tr:last-child td { border-bottom: none; }
    .inline-icon { font-size: 26px; vertical-align: middle; }
    .success-illustration { font-size: 60px; margin: 8px 0 9px; }
    .profile-card { max-width: 620px; }
    .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 23px; }
    .profile-header .avatar { height: 56px; width: 56px; flex: 0 0 56px; font-size: 20px; }
    .filter-bar { display: flex; gap: 7px; flex-wrap: wrap; margin: 18px 0; }
    .staff-card { border-left: 4px solid var(--cyan); }
    .footer-note { margin-top: 29px; color: #8A98A9; text-align: center; font-size: 11px; }
    #toast { position: fixed; bottom: 22px; right: 22px; max-width: min(400px, calc(100vw - 40px)); padding: 13px 18px; border-radius: 11px; background: #133F72; color: white; box-shadow: 0 14px 28px rgba(0,0,0,.2); z-index: 100; display: none; line-height: 1.5; }
    #toast.error { background: #9D2832; }
    #toast.visible { display: block; }

    @media (max-width: 1080px) {
      .food-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar, .content { padding-left: 24px; padding-right: 24px; }
      .two-col { grid-template-columns: 1fr; }
    }
    @media (max-width: 800px) {
      .auth-page { grid-template-columns: 1fr; }
      .auth-left { min-height: 280px; padding: 30px 24px; }
      .auth-left h1 { font-size: 36px; }
      .auth-features, .auth-bottom, .auth-left::before { display: none; }
      .auth-right { padding: 25px 20px 55px; }
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-110%); transition: transform .2s; box-shadow: 12px 0 35px rgba(0,0,0,.12); }
      body.menu-open .sidebar { transform: translateX(0); }
      body.menu-open .overlay { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 19; }
      .hamburger { display: inline-block; }
      .topbar { padding: 0 17px; height: 70px; }
      .content { padding: 22px 16px 50px; }
      .top-date { display: none; }
      .hero { padding: 24px; }
      .hero-emoji { font-size: 70px; }
      .cart-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 550px) {
      .food-grid { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .stat:last-child { grid-column: span 2; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
      .hero-emoji { display: none; }
      .hero { padding: 25px 21px; }
      .hero h1 { font-size: 27px; }
      .card { padding: 17px; }
      .cart-line { flex-wrap: wrap; }
      .line-price { margin-left: auto; }
      .topbar h2 { font-size: 16px; }
      .order-timeline .caption { font-size: 9px; }
      .role-chip { display: none; }
    }

    /* Solar icon system: inline SVG symbols keep everything offline. */
    .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .solar-icon { width: 20px; height: 20px; flex: 0 0 auto; display: inline-block; vertical-align: middle; }
    .btn .solar-icon { width: 17px; height: 17px; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; }
    .nav-icon .solar-icon { width: 21px; height: 21px; }
    .auth-feature { display: inline-flex; gap: 8px; align-items: center; }
    .auth-feature .solar-icon { width: 17px; height: 17px; }
    .hero-art { width: 156px; height: 156px; flex: 0 0 auto; display: grid; place-items: center;
      border-radius: 38px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
      transform: rotate(-9deg); position: relative; z-index: 1; }
    .hero-art .solar-icon { width: 105px; height: 105px; color: white; transform: rotate(9deg); }
    .stat-icon { display: inline-flex; float: right; color: var(--blue); background: #EFF7FF; border-radius: 11px; padding: 9px; }
    .stat-icon .solar-icon { width: 22px; height: 22px; }
    .food-picture { isolation: isolate; }
    .food-picture span { filter: none; }
    .food-picture::after { content: ""; position: absolute; z-index: -1; width: 116px; height: 116px; border: 1px solid rgba(0,76,152,.13); border-radius: 30px; transform: rotate(25deg); }
    .food-picture span { width: 80px; height: 80px; display: grid; place-items: center; color: var(--blue); }
    .food-picture .solar-icon { width: 75px; height: 75px; }
    .food-picture.snacks span { color: #9B6308; }
    .food-picture.drinks span { color: #007C94; }
    .food-picture.desserts span { color: #AF4367; }
    .line-image .solar-icon { width: 38px; height: 38px; color: var(--blue); }
    .inline-icon .solar-icon { width: 23px; height: 23px; color: var(--blue); }
    .big-icon .solar-icon { width: 46px; height: 46px; color: var(--blue); }
    .search-field { position: relative; flex: 1; max-width: 360px; min-width: 220px; }
    .search-field > .solar-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #536680; width: 19px; height: 19px; pointer-events: none; }
    .search-field .search-box { min-width: 0; max-width: none; width: 100%; padding-left: 41px; }
    .status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .status .solar-icon { width: 15px; height: 15px; }
    .success-illustration { width: 88px; height: 88px; border-radius: 50%; margin: 8px auto 18px;
      display: grid; place-items: center; background: #E1F6E9; color: var(--green); }
    .success-illustration .solar-icon { width: 58px; height: 58px; }
    .payment-icon { display: inline-flex; margin-right: 8px; vertical-align: middle; }
    .payment-icon .solar-icon { width: 17px; height: 17px; }
    .timeline-step .bubble .solar-icon { width: 18px; height: 18px; }
    .timeline-step .bubble { display: grid; place-items: center; }
    .hamburger { align-items: center; justify-content: center; width: 44px; height: 44px; }
    .hamburger .solar-icon { width: 23px; height: 23px; }
    .food-card { transition: transform .18s ease, box-shadow .18s ease; }
    .food-card:hover { transform: translateY(-3px); box-shadow: 0 17px 34px rgba(18,50,87,.12); }
    .btn:active:not(:disabled) { transform: translateY(0) scale(.99); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid #0074B8; outline-offset: 3px; }
    @media (max-width: 800px) { .hamburger { display: inline-flex; } .hero-art { width: 110px; height: 110px; border-radius: 26px; } .hero-art .solar-icon { width: 68px; height: 68px; } }
    @media (max-width: 550px) { .hero-art { display: none; } .search-field { max-width: none; width: 100%; } .menu-tools > .btn { flex: 1; } .nav-button { min-height: 44px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* Food photographs: lightweight responsive images, no animation libraries */
    .food-picture { position: relative; overflow: hidden; height: 178px; background: #EDF2F7; }
    .food-picture::after { display: none; }
    .food-picture > .photo-area { width: 100%; height: 100%; position: relative; }
    .photo-area > img, .cart-photo > img, .admin-photo > img {
      display: block; width: 100%; height: 100%; object-fit: cover;
    }
    .food-picture > .photo-area > img { transition: transform .25s ease; }
    .food-card:hover .food-picture > .photo-area > img { transform: scale(1.035); }
    .photo-fallback { display: none; width: 100%; height: 100%; place-items: center; color: var(--blue); background: #EAF3FB; }
    .photo-fallback .solar-icon { width: 44px; height: 44px; }
    .no-photo .photo-fallback { display: grid; }
    .food-picture .photo-fallback { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
    .food-picture .no-photo .photo-fallback { display: grid; }
    .food-picture .photo-fallback .solar-icon { width: 62px; height: 62px; }
    .food-tag { z-index: 1; box-shadow: 0 2px 7px rgba(0, 0, 0, .08); }
    .line-image { padding: 0; overflow: hidden; background: #EDF4FA; }
    .cart-photo, .admin-photo { width: 100%; height: 100%; position: relative; }
    .cart-photo .photo-fallback, .admin-photo .photo-fallback { position: absolute; inset: 0; }
    .inline-photo { width: 38px; height: 38px; display: inline-block; vertical-align: middle; overflow: hidden; border-radius: 8px; margin-right: 8px; }
    .photo-credits { max-width: 850px; margin: 11px auto 0; text-align: left; font-size: 11px; }
    .photo-credits summary { cursor: pointer; text-align: center; text-decoration: underline; text-underline-offset: 2px; }
    .photo-credits p { text-align: center; }
    .photo-credits ul { columns: 2; padding-left: 22px; line-height: 1.8; }
    .photo-credits li { break-inside: avoid; }
    .photo-credits a { color: var(--blue); }
    @media (max-width: 600px) { .photo-credits ul { columns: 1; } .food-picture { height: 168px; } }
    @media (prefers-reduced-motion: reduce) {
      .food-picture > .photo-area > img { transition: none; }
      .food-card:hover .food-picture > .photo-area > img { transform: none; }
    }

    function saveData() {
      localStorage.setItem("uc_users_v1", JSON.stringify(users));
      localStorage.setItem("uc_menu_v1", JSON.stringify(menu));
      localStorage.setItem("uc_orders_v1", JSON.stringify(orders));
      localStorage.setItem("uc_current_user_v1", JSON.stringify(currentUser ? currentUser.id : null));
    }

    function findUser(id) {
      for (var i = 0; i < users.length; i++) {
        if (users[i].id === id) return users[i];
      }
      return null;
    }

    function findFood(id) {
      for (var i = 0; i < menu.length; i++) {
        if (menu[i].id === id) return menu[i];
      }
      return null;
    }

    function findOrder(id) {
      for (var i = 0; i < orders.length; i++) {
        if (orders[i].id === id) return orders[i];
      }
      return null;
    }

    function getMyOrders() {
      var result = [];
      for (var i = 0; i < orders.length; i++) {
        if (currentUser && orders[i].studentId === currentUser.id) result.push(orders[i]);
      }
      return result;
    }

    // Render a Solar icon. Shapes are stored in this HTML file above.
    function solarIcon(name, extraClass) {
      var names = ["bag", "whisk", "donut", "cup", "tea", "cart", "orders",
                   "user", "logout", "search", "hamburger", "check", "plus",
                   "clock", "bell"];
      if (names.indexOf(name) === -1) name = "bag";
      return '<svg class="solar-icon ' + (extraClass || "") +
             '" aria-hidden="true" focusable="false"><use href="#si-' + name + '"></use></svg>';
    }

    // Pick the appropriate icon for older menu data saved by the previous version.
    function foodIcon(food) {
      if (food.icon) return food.icon;
      if (food.category === "Drinks") return "cup";
      if (food.category === "Desserts") return "donut";
      if (food.category === "Snacks") return "bag";
      return "whisk";
    }

    function samplePhotoFor(food) {
      // The default demo IDs stay the same even if a previous menu was saved.
      var index = food.id - 1;
      if (index >= 0 && index < samplePhotos.length) {
        return photoAddress(samplePhotos[index].file);
      }
      return "";
    }

    function photoAddress(fileName) {
      return "https://commons.wikimedia.org/wiki/Special:FilePath/" +
             encodeURIComponent(fileName.replace(/ /g, "_")) + "?width=700";
    }

    function foodPhoto(food) {
      if (food.photoUrl && /^https:\/\/[^\s"'<>]+$/i.test(food.photoUrl)) {
        return food.photoUrl;
      }
      return samplePhotoFor(food);
    }

    // Use the same photo in food cards, shopping cart, and menu management.
    function photoElement(food, className) {
      var source = foodPhoto(food);
      var fallback = '<span class="photo-fallback" aria-hidden="true">' +
                     solarIcon(foodIcon(food)) + '</span>';
      if (!source) return '<div class="' + className + ' no-photo">' + fallback + '</div>';
      return '<div class="' + className + '"><img src="' + escapeHTML(source) +
             '" alt="' + escapeHTML(food.name) + ' food photograph" loading="lazy" ' +
             'decoding="async" referrerpolicy="no-referrer" ' +
             'onerror="this.style.display=&quot;none&quot;;this.nextElementSibling.style.display=&quot;grid&quot;">' +
             fallback + '</div>';
    }

    function photoCredits() {
      var html = '<details class="photo-credits"><summary>Food photograph credits and licenses</summary>' +
        '<p>Illustrative food photographs from Wikimedia Commons. Images are cropped by ' +
        'the card layout; actual canteen servings may differ.</p><ul>';
      for (var i = 0; i < samplePhotos.length; i++) {
        var info = samplePhotos[i];
        var filePage = 'https://commons.wikimedia.org/wiki/File:' +
                       encodeURIComponent(info.file.replace(/ /g, '_'));
        var licensePages = {
          "CC BY 4.0": "https://creativecommons.org/licenses/by/4.0/",
          "CC BY-SA 4.0": "https://creativecommons.org/licenses/by-sa/4.0/",
          "CC BY-SA 3.0": "https://creativecommons.org/licenses/by-sa/3.0/",
          "CC0 1.0": "https://creativecommons.org/publicdomain/zero/1.0/",
          "Public domain": "https://creativecommons.org/publicdomain/mark/1.0/"
        };
        html += '<li><a href="' + filePage + '" target="_blank" ' +
                'rel="noopener noreferrer">' + escapeHTML(defaultMenu[i].name) + '</a>' +
                ' — ' + escapeHTML(info.credit) + ' (<a href="' + licensePages[info.license] +
                '" target="_blank" rel="noopener noreferrer">' +
                escapeHTML(info.license) + '</a>)</li>';
      }
      html += '</ul></details>';
      return html;
    }

    function money(amount) {
      return "₱" + Number(amount).toFixed(2);
    }

    function formatDate(dateText) {
      return new Date(dateText).toLocaleString("en-PH", { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    function escapeHTML(text) {
      return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function initials(name) {
      var words = name.trim().split(" ");
      return (words[0].charAt(0) + (words.length > 1 ? words[words.length - 1].charAt(0) : "")).toUpperCase();
    }

    function showToast(message, isError) {
      var toast = document.getElementById("toast");
      toast.textContent = message;
      toast.setAttribute("role", isError ? "alert" : "status");
      toast.className = "visible" + (isError ? " error" : "");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function () { toast.className = ""; }, 3500);
    }

    function cartCount() {
      var count = 0;
      for (var i = 0; i < cart.length; i++) count += cart[i].quantity;
      return count;
    }

    function cartTotal() {
      var total = 0;
      for (var i = 0; i < cart.length; i++) {
        var item = findFood(cart[i].foodId);
        if (item) total += item.price * cart[i].quantity;
      }
      return total;
    }

    // 3. User registration and sign-in (demo only)
    function login(event) {
      event.preventDefault();
      var email = document.getElementById("login-email").value.trim().toLowerCase();
      var password = document.getElementById("login-password").value;
      for (var i = 0; i < users.length; i++) {
        if (users[i].email.toLowerCase() === email && users[i].password === password) {
          currentUser = users[i];
          cart = [];
          currentPage = "dashboard";
          saveData();
          renderApp();
          showToast("Signed in as " + currentUser.name + ".");
          return;
        }
      }
      showToast("Incorrect email or password. Please try again.", true);
    }

    function fillDemo(role) {
      var email = role + "@uc.edu.ph";
      var password = role === "student" ? "Student123" : role === "staff" ? "Staff123" : "Admin123";
      document.getElementById("login-email").value = email;
      document.getElementById("login-password").value = password;
      showToast("Demo account filled. Select Sign In.");
    }

    function register(event) {
      event.preventDefault();
      var name = document.getElementById("register-name").value.trim();
      var studentId = document.getElementById("register-id").value.trim();
      var email = document.getElementById("register-email").value.trim().toLowerCase();
      var password = document.getElementById("register-password").value;
      var confirmPassword = document.getElementById("register-confirm").value;

      if (!name || !studentId || !email || !password) {
        showToast("Please complete all fields.", true);
        return;
      }
      if (password.length < 6) {
        showToast("Password must have at least 6 characters.", true);
        return;
      }
      if (password !== confirmPassword) {
        showToast("Passwords do not match.", true);
        return;
      }
      for (var i = 0; i < users.length; i++) {
        if (users[i].email.toLowerCase() === email || users[i].studentId === studentId) {
          showToast("Email or Student ID is already registered.", true);
          return;
        }
      }
      var newId = 1;
      for (var j = 0; j < users.length; j++) if (users[j].id >= newId) newId = users[j].id + 1;
      users.push({ id: newId, name: name, studentId: studentId, email: email, password: password, role: "student" });
      saveData();
      authPage = "login";
      renderApp();
      showToast("Registration successful! Sign in with your new account.");
    }

    function logout() {
      currentUser = null;
      cart = [];
      lastOrderId = null;
      selectedOrderId = null;
      selectedCategory = "All";
      searchText = "";
      staffFilter = "All";
      editingItemId = null;
      currentPage = "dashboard";
      authPage = "login";
      saveData();
      document.body.classList.remove("menu-open");
      renderApp();
      showToast("You have signed out.");
    }

    function showAuth(page) {
      authPage = page;
      renderApp();
    }

    // 4. Navigation
    function showPage(page) {
      if (!currentUser) return;
      var studentOnly = ["menu", "cart", "checkout", "confirmation", "orders", "order-details"];
      var staffOnly = ["staff-orders"];
      var adminOnly = ["manage-menu"];
      if (studentOnly.indexOf(page) !== -1 && currentUser.role !== "student") return;
      if (staffOnly.indexOf(page) !== -1 && currentUser.role === "student") return;
      if (adminOnly.indexOf(page) !== -1 && currentUser.role !== "admin") return;
      currentPage = page;
      document.body.classList.remove("menu-open");
      renderApp();
      window.scrollTo(0, 0);
    }

    function toggleMobileMenu() {
      var isOpen = document.body.classList.toggle("menu-open");
      var button = document.querySelector(".hamburger");
      if (button) {
        button.setAttribute("aria-expanded", String(isOpen));
        button.setAttribute("aria-label", isOpen ? "Close menu" : "Open menu");
      }
    }

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && document.body.classList.contains("menu-open")) {
        toggleMobileMenu();
        var button = document.querySelector(".hamburger");
        if (button) button.focus();
      }
    });

    function navButton(page, icon, label, badge) {
      return '<button class="nav-button ' + (currentPage === page ? "active" : "") + '" onclick="showPage(\'' + page + '\')">' +
        '<span class="nav-icon">' + solarIcon(icon) + '</span><span>' + label + '</span>' + (badge ? '<span class="nav-count">' + badge + '</span>' : '') + '</button>';
    }

    function pageTitle() {
      var titles = { dashboard: "Dashboard", menu: "Food Menu", cart: "My Cart", checkout: "Checkout", confirmation: "Order Confirmed", orders: "My Orders", "order-details": "Order Details", profile: "My Profile", "staff-orders": "Order Management", "manage-menu": "Menu Management" };
      return titles[currentPage] || "Campus Canteen";
    }

    // 5. Main page rendering
    function renderApp() {
      var app = document.getElementById("app");
      if (!currentUser) {
        app.innerHTML = renderAuthPage();
        return;
      }
      var navigation = navButton("dashboard", "bag", "Dashboard", "");
      if (currentUser.role === "student") {
        navigation += navButton("menu", "whisk", "Food Menu", "");
        navigation += navButton("cart", "cart", "My Cart", cartCount());
        navigation += navButton("orders", "orders", "My Orders", "");
      } else {
        navigation += navButton("staff-orders", "orders", "Manage Orders", "");
        if (currentUser.role === "admin") navigation += navButton("manage-menu", "whisk", "Manage Menu", "");
      }
      navigation += navButton("profile", "user", "My Profile", "");

      var html = '<div class="app"><div class="overlay" onclick="toggleMobileMenu()"></div>' +
        '<aside class="sidebar" id="app-sidebar" role="navigation" aria-label="Application navigation"><div class="brand"><div class="brand-mark"><img class="uc-logo" alt="University of Cebu logo" src="' + logoImage + '"></div>' +
        '<div class="brand-name">UC Canteen<span class="brand-sub">Campus Food Ordering</span></div></div>' +
        '<div class="nav-caption">Main Navigation</div>' + navigation +
        '<div class="sidebar-bottom"><div class="sidebar-user"><div class="avatar">' + initials(currentUser.name) + '</div><div><strong>' + escapeHTML(currentUser.name) + '</strong><small>' + currentUser.role + '</small></div></div>' +
        '<button class="nav-button" onclick="logout()"><span class="nav-icon">' + solarIcon('logout') + '</span>Sign Out</button></div></aside>' +
        '<main class="main"><header class="topbar"><div class="button-row"><button class="hamburger" aria-label="Open menu" aria-controls="app-sidebar" aria-expanded="false" onclick="toggleMobileMenu()">' + solarIcon("hamburger") + '</button><div><div class="top-label">University of Cebu / Campus Services</div><h2>' + pageTitle() + '</h2></div></div>' +
        '<div class="top-right"><span class="top-date">' + new Date().toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" }) + '</span><span class="role-chip">' + currentUser.role + '</span><div class="avatar">' + initials(currentUser.name) + '</div></div></header>' +
        '<div class="content">' + renderCurrentPage() + '<div class="footer-note">UC Campus Canteen · Second-year student demonstration · Information is saved only in this browser<br>Icons: <a href="https://solar-icons.dev/icons" target="_blank" rel="noopener noreferrer">Solar by 480 Design (CC BY 4.0)</a>' +
        photoCredits() + '</div></div></main></div>';
      app.innerHTML = html;
      if (currentPage === "menu") updateMenuResults();
      if (currentPage === "manage-menu") selectSavedIcon();
    }

    function renderAuthPage() {
      var form = '';
      if (authPage === "register") {
        form = '<span class="eyebrow">Student Registration</span><h2>Create an account</h2><p class="intro">Fill in your details to access the canteen menu.</p>' +
          '<form onsubmit="register(event)"><div class="form-field"><label for="register-name">Full Name</label><input id="register-name" maxlength="70" required placeholder="e.g., Juan Dela Cruz"></div>' +
          '<div class="form-field"><label for="register-id">Student ID</label><input id="register-id" maxlength="24" required placeholder="e.g., 2026-1234"></div>' +
          '<div class="form-field"><label for="register-email">Email Address</label><input type="email" id="register-email" maxlength="100" required placeholder="name@example.com"></div>' +
          '<div class="form-row"><div class="form-field"><label for="register-password">Password</label><input type="password" id="register-password" required minlength="6" placeholder="At least 6 characters"></div>' +
          '<div class="form-field"><label for="register-confirm">Confirm Password</label><input type="password" id="register-confirm" required placeholder="Repeat password"></div></div>' +
          '<button class="btn btn-primary btn-block" type="submit">Create Student Account</button></form>' +
          '<p class="center muted small">Already have an account? <button class="auth-link" onclick="showAuth(\'login\')">Sign In</button></p>';
      } else {
        form = '<span class="eyebrow">Welcome Back</span><h2>Sign in to your account</h2><p class="intro">Your campus meals are just a few clicks away.</p>' +
          '<form onsubmit="login(event)"><div class="form-field"><label for="login-email">Email Address</label><input type="email" id="login-email" autocomplete="username" required placeholder="Enter your email"></div>' +
          '<div class="form-field"><label for="login-password">Password</label><input type="password" id="login-password" autocomplete="current-password" required placeholder="Enter password"></div>' +
          '<button class="btn btn-primary btn-block" type="submit">Sign In</button></form>' +
          '<p class="center muted small">New student? <button class="auth-link" onclick="showAuth(\'register\')">Create an Account</button></p>' +
          '<div class="demo-box"><h4>Try a demo account</h4><p class="small muted" style="margin:0 0 12px">Select a role to fill the sign-in form:</p>' +
          '<div class="demo-buttons"><button class="btn btn-outline btn-sm" onclick="fillDemo(\'student\')">Student</button>' +
          '<button class="btn btn-outline btn-sm" onclick="fillDemo(\'staff\')">Staff</button><button class="btn btn-outline btn-sm" onclick="fillDemo(\'admin\')">Admin</button></div></div>';
      }
      return '<div class="auth-page"><section class="auth-left"><div class="auth-logo-box"><img class="uc-logo" alt="University of Cebu logo" src="' + logoImage + '"></div>' +
        '<div><div class="auth-tag">CAMPUS FOOD ORDERING SYSTEM</div><h1>Good food.<br>Better campus days.</h1>' +
        '<p class="subline">Browse affordable meals, order ahead, and pick up your food at the campus canteen.</p>' +
        '<div class="auth-features"><span class="auth-feature">' + solarIcon("whisk") + ' Fresh campus meals</span><span class="auth-feature">' + solarIcon("cart") + ' Easy ordering</span><span class="auth-feature">' + solarIcon("check") + ' Order tracking</span></div></div>' +
        '<div class="auth-bottom">Inspired by the University of Cebu visual identity · Student prototype</div></section>' +
        '<section class="auth-right"><div class="auth-form-wrap">' + form +
        '<p class="auth-footnote">Classroom-only demonstration. Accounts are stored locally in your browser, not on a secure server. Do not use your real password or personal student information.</p></div></section></div>';
    }

    function renderCurrentPage() {
      if (currentPage === "dashboard") return renderDashboard();
      if (currentPage === "menu") return renderMenu();
      if (currentPage === "cart") return renderCart();
      if (currentPage === "checkout") return renderCheckout();
      if (currentPage === "confirmation") return renderConfirmation();
      if (currentPage === "orders") return renderOrders();
      if (currentPage === "order-details") return renderOrderDetails();
      if (currentPage === "profile") return renderProfile();
      if (currentPage === "staff-orders") return renderStaffOrders();
      if (currentPage === "manage-menu") return renderManageMenu();
      return renderDashboard();
    }

    function renderDashboard() {
      if (currentUser.role !== "student") {
        var active = 0;
        var ready = 0;
        for (var i = 0; i < orders.length; i++) {
          if (orders[i].status === "Pending" || orders[i].status === "Preparing") active++;
          if (orders[i].status === "Ready for Pickup") ready++;
        }
        return '<div class="hero"><div><div class="eyebrow">Canteen Operations</div><h1>Welcome back, ' + escapeHTML(currentUser.name.split(" ")[0]) + '!</h1>' +
          '<p>View student orders, update their status, and keep the canteen running smoothly.</p><button class="btn btn-yellow" onclick="showPage(\'staff-orders\')">Manage Orders</button></div><div class="hero-art" aria-hidden="true">' + solarIcon('whisk') + '</div></div>' +
          '<div class="stat-grid"><div class="stat"><span class="stat-icon">' + solarIcon("orders") + '</span><span>Total Orders</span><strong>' + orders.length + '</strong></div>' +
          '<div class="stat"><span class="stat-icon">' + solarIcon("whisk") + '</span><span>Pending / Preparing</span><strong>' + active + '</strong></div>' +
          '<div class="stat"><span class="stat-icon">' + solarIcon("check") + '</span><span>Ready for Pickup</span><strong>' + ready + '</strong></div></div>' +
          '<div class="card"><h3>Quick Actions</h3><p class="muted">Process incoming orders from the order management screen.</p><div class="button-row">' +
          '<button class="btn btn-primary" onclick="showPage(\'staff-orders\')">Open Orders</button>' +
          (currentUser.role === "admin" ? '<button class="btn btn-outline" onclick="showPage(\'manage-menu\')">Manage Food Menu</button>' : '') + '</div></div>';
      }
      var myOrders = getMyOrders();
      var activeOrders = 0;
      var completed = 0;
      for (var j = 0; j < myOrders.length; j++) {
        if (myOrders[j].status === "Pending" || myOrders[j].status === "Preparing" || myOrders[j].status === "Ready for Pickup") activeOrders++;
        if (myOrders[j].status === "Completed") completed++;
      }
      var featured = '<div class="food-grid">';
      var shown = 0;
      for (var k = 0; k < menu.length && shown < 3; k++) {
        if (menu[k].available) { featured += foodCard(menu[k]); shown++; }
      }
      featured += '</div>';
      return '<div class="hero"><div><div class="eyebrow">Your Campus Food Hub</div><h1>Hi, ' + escapeHTML(currentUser.name.split(" ")[0]) + '! Hungry?</h1>' +
        '<p>Skip the long line. Find your favorite meal, order it here, and pick it up when ready.</p><button class="btn btn-yellow" onclick="showPage(\'menu\')">Browse Food Menu</button></div><div class="hero-art" aria-hidden="true">' + solarIcon('whisk') + '</div></div>' +
        '<div class="stat-grid"><div class="stat"><span class="stat-icon">' + solarIcon("whisk") + '</span><span>Available Food Items</span><strong>' + availableMenuCount() + '</strong></div>' +
        '<div class="stat"><span class="stat-icon">' + solarIcon("bag") + '</span><span>Active Orders</span><strong>' + activeOrders + '</strong></div>' +
        '<div class="stat"><span class="stat-icon">' + solarIcon("check") + '</span><span>Completed Orders</span><strong>' + completed + '</strong></div></div>' +
        '<div class="section-head"><h2>Popular Picks</h2><button class="btn btn-outline btn-sm" onclick="showPage(\'menu\')">View All Food</button></div>' +
        (shown ? featured : '<div class="empty">The menu is currently unavailable.</div>') +
        '<div class="section-head"><h2>How to Order</h2></div><div class="card"><div class="steps">' +
        '<div class="step"><div class="step-number">1</div><div><strong>Browse the menu</strong><p>Choose from the food and drinks offered in the canteen.</p></div></div>' +
        '<div class="step"><div class="step-number">2</div><div><strong>Add your favorites to the cart</strong><p>Choose quantities and check your total.</p></div></div>' +
        '<div class="step"><div class="step-number">3</div><div><strong>Confirm and track your order</strong><p>Pay at pickup and monitor your order status.</p></div></div></div></div>';
    }

    function availableMenuCount() {
      var count = 0;
      for (var i = 0; i < menu.length; i++) if (menu[i].available) count++;
      return count;
    }

    function foodCard(food) {
      var category = food.category.toLowerCase();
      return '<article class="food-card"><div class="food-picture ' + category + '">' +
        photoElement(food, 'photo-area') + '<div class="food-tag">' + escapeHTML(food.category) + '</div></div>' +
        '<div class="food-info"><h3>' + escapeHTML(food.name) + '</h3><p>' + escapeHTML(food.description) + '</p>' +
        '<div class="food-card-bottom"><span class="price">' + money(food.price) + '</span>' +
        '<button class="btn btn-primary btn-sm" onclick="addToCart(' + food.id + ')">' + solarIcon("plus") + ' Add to Cart</button></div></div></article>';
    }

    function renderMenu() {
      return '<div class="page-intro"><span class="eyebrow">Explore Our Food</span><h1>What would you like to eat?</h1><p>Fresh, affordable meals for your campus day. All prices are in Philippine pesos.</p></div>' +
        '<div class="menu-tools"><div class="search-field">' + solarIcon("search") + '<input class="search-box" id="food-search" aria-label="Search food" placeholder="Search food or drink..." oninput="searchMenu()" value="' + escapeHTML(searchText) + '"></div>' +
        '<button class="btn btn-outline" onclick="showPage(\'cart\')">' + solarIcon("cart") + ' View Cart (' + cartCount() + ')</button></div>' +
        '<div class="chips" id="category-chips">' + categoryButtons() + '</div>' +
        '<div class="section-head"><h2>Available Menu</h2><span class="muted small" id="result-count"></span></div><div class="food-grid" id="food-results"></div>';
    }

    function categoryButtons() {
      var categories = ["All", "Meals", "Snacks", "Drinks", "Desserts"];
      var html = '';
      for (var i = 0; i < categories.length; i++) {
        html += '<button class="chip ' + (categories[i] === selectedCategory ? 'selected' : '') + '" aria-pressed="' + (categories[i] === selectedCategory ? 'true' : 'false') + '" onclick="selectCategory(\'' + categories[i] + '\')">' + categories[i] + '</button>';
      }
      return html;
    }

    function searchMenu() {
      searchText = document.getElementById("food-search").value;
      updateMenuResults();
    }

    function selectCategory(category) {
      selectedCategory = category;
      document.getElementById("category-chips").innerHTML = categoryButtons();
      updateMenuResults();
    }

    function updateMenuResults() {
      var container = document.getElementById("food-results");
      if (!container) return;
      var html = '';
      var count = 0;
      var query = searchText.toLowerCase();
      for (var i = 0; i < menu.length; i++) {
        var food = menu[i];
        if (!food.available) continue;
        if (selectedCategory !== "All" && selectedCategory !== food.category) continue;
        if (food.name.toLowerCase().indexOf(query) === -1 && food.description.toLowerCase().indexOf(query) === -1) continue;
        html += foodCard(food);
        count++;
      }
      container.innerHTML = count ? html : '<div class="empty" style="grid-column:1/-1"><div class="big-icon">' + solarIcon("search") + '</div><h3>No matching food</h3><p>Try a different keyword or category.</p><button class="btn btn-outline" onclick="clearMenuSearch()">Clear Filters</button></div>';
      document.getElementById("result-count").textContent = count + " item(s)";
    }

    function clearMenuSearch() {
      selectedCategory = "All";
      searchText = "";
      renderApp();
      updateMenuResults();
    }

    // 6. Student cart and checkout
    function addToCart(foodId) {
      if (!currentUser || currentUser.role !== "student") return;
      var food = findFood(foodId);
      if (!food || !food.available) {
        showToast("Sorry, this item is currently unavailable.", true);
        return;
      }
      for (var i = 0; i < cart.length; i++) {
        if (cart[i].foodId === foodId) {
          cart[i].quantity++;
          showToast(food.name + " added to your cart.");
          renderApp();
          updateMenuResults();
          return;
        }
      }
      cart.push({ foodId: foodId, quantity: 1 });
      showToast(food.name + " added to your cart.");
      renderApp();
      updateMenuResults();
    }

    function changeQuantity(foodId, amount) {
      for (var i = 0; i < cart.length; i++) {
        if (cart[i].foodId === foodId) {
          cart[i].quantity += amount;
          if (cart[i].quantity <= 0) cart.splice(i, 1);
          break;
        }
      }
      renderApp();
    }

    function removeFromCart(foodId) {
      for (var i = 0; i < cart.length; i++) {
        if (cart[i].foodId === foodId) {
          cart.splice(i, 1);
          break;
        }
      }
      renderApp();
    }

    function renderCart() {
      if (!cart.length) return '<div class="page-intro"><h1>My Cart</h1><p>Review your selected food before checkout.</p></div>' +
        '<div class="empty"><div class="big-icon">' + solarIcon("cart") + '</div><h3>Your cart is empty</h3><p>Explore our menu and add something delicious.</p><button class="btn btn-primary" onclick="showPage(\'menu\')">Browse Menu</button></div>';
      var items = '';
      for (var i = 0; i < cart.length; i++) {
        var food = findFood(cart[i].foodId);
        if (!food) continue;
        items += '<div class="cart-line"><div class="line-image">' + photoElement(food, 'cart-photo') + '</div><div class="line-info"><h3>' + escapeHTML(food.name) + '</h3><div class="muted">' + money(food.price) + ' each</div>' +
          '<div class="qty-controls" style="margin-top:10px"><button aria-label="Decrease quantity" onclick="changeQuantity(' + food.id + ', -1)">−</button><span>' + cart[i].quantity + '</span><button aria-label="Increase quantity" onclick="changeQuantity(' + food.id + ', 1)">+</button></div></div>' +
          '<div class="line-price"><strong>' + money(food.price * cart[i].quantity) + '</strong><button class="plain-link" onclick="removeFromCart(' + food.id + ')">Remove</button></div></div>';
      }
      return '<div class="page-intro"><span class="eyebrow">Your Order</span><h1>My Cart</h1><p>Review quantities and proceed when you are ready.</p></div>' +
        '<div class="cart-layout"><div class="card"><h2>Selected Food (' + cartCount() + ')</h2>' + items + '<div class="button-row" style="margin-top:17px"><button class="btn btn-outline" onclick="showPage(\'menu\')">Continue Shopping</button></div></div>' +
        '<div class="card"><h3>Order Summary</h3><div class="divider"></div><div class="summary-row"><span class="muted">Items</span><strong>' + cartCount() + '</strong></div>' +
        '<div class="summary-row"><span class="muted">Subtotal</span><strong>' + money(cartTotal()) + '</strong></div><div class="summary-row"><span class="muted">Service Fee</span><strong>Free</strong></div>' +
        '<div class="divider"></div><div class="summary-row"><strong>Total</strong><span class="summary-total">' + money(cartTotal()) + '</span></div>' +
        '<button class="btn btn-primary btn-block" onclick="showPage(\'checkout\')">Proceed to Checkout</button></div></div>';
    }

    function renderCheckout() {
      if (!cart.length) { currentPage = "cart"; return renderCart(); }
      var items = '';
      for (var i = 0; i < cart.length; i++) {
        var food = findFood(cart[i].foodId);
        if (food) items += '<div class="summary-row"><span>' + cart[i].quantity + ' × ' + escapeHTML(food.name) + '</span><strong>' + money(food.price * cart[i].quantity) + '</strong></div>';
      }
      return '<div class="page-intro"><span class="eyebrow">Almost Done</span><h1>Confirm Your Order</h1><p>Check your details before submitting your order.</p></div>' +
        '<form onsubmit="submitOrder(event)"><div class="cart-layout"><div class="card"><h2>Pickup Information</h2><p class="muted small">Please collect your order at the UC campus canteen.</p><div class="divider"></div>' +
        '<div class="form-field"><label for="pickup-name">Pickup Name</label><input id="pickup-name" maxlength="70" value="' + escapeHTML(currentUser.name) + '" required></div>' +
        '<div class="form-field"><label for="pickup-time">Pickup Preference</label><select id="pickup-time"><option value="As soon as ready">As soon as ready</option><option value="Around 15 minutes">Around 15 minutes</option><option value="Around 30 minutes">Around 30 minutes</option></select></div>' +
        '<div class="form-field"><label for="order-notes">Special Instructions (optional)</label><textarea id="order-notes" maxlength="200" placeholder="e.g., No spicy sauce"></textarea></div>' +
        '<div class="notice"><span class="payment-icon">' + solarIcon("bag") + '</span><strong>Payment Method: Pay at Pickup</strong><br>This student demonstration does not process online payments.</div></div>' +
        '<div class="card"><h3>Order Summary</h3><div class="divider"></div>' + items + '<div class="divider"></div><div class="summary-row"><strong>Total to Pay</strong><span class="summary-total">' + money(cartTotal()) + '</span></div>' +
        '<button type="submit" class="btn btn-primary btn-block">' + solarIcon("check") + ' Place Order</button><button type="button" class="btn btn-outline btn-block" style="margin-top:9px" onclick="showPage(\'cart\')">Back to Cart</button></div></div></form>';
    }

    function submitOrder(event) {
      event.preventDefault();
      if (!currentUser || currentUser.role !== "student" || !cart.length) return;
      var pickupName = document.getElementById("pickup-name").value.trim();
      var pickupTime = document.getElementById("pickup-time").value;
      var notes = document.getElementById("order-notes").value.trim();
      if (!pickupName) { showToast("Please provide a pickup name.", true); return; }
      var orderItems = [];
      var total = 0;
      for (var i = 0; i < cart.length; i++) {
        var food = findFood(cart[i].foodId);
        if (!food || !food.available) {
          showToast("An item in your cart is unavailable. Please update your cart.", true);
          return;
        }
        orderItems.push({ foodId: food.id, name: food.name, price: food.price, quantity: cart[i].quantity });
        total += food.price * cart[i].quantity;
      }
      var newId = 1001;
      for (var j = 0; j < orders.length; j++) if (orders[j].id >= newId) newId = orders[j].id + 1;
      orders.push({ id: newId, studentId: currentUser.id, pickupName: pickupName, pickupTime: pickupTime, notes: notes, items: orderItems, total: total, status: "Pending", createdAt: new Date().toISOString() });
      lastOrderId = newId;
      cart = [];
      saveData();
      showPage("confirmation");
      showToast("Order #" + newId + " placed successfully!");
    }

    function renderConfirmation() {
      var order = findOrder(lastOrderId);
      if (!order || order.studentId !== currentUser.id) return renderOrders();
      return '<div class="card center" style="max-width:620px;margin:35px auto;padding:40px 25px"><div class="success-illustration">' + solarIcon("check") + '</div><span class="eyebrow">Order Submitted</span>' +
        '<h1>Your order is confirmed!</h1><p class="muted">The canteen has received your order. Check My Orders for its preparation status.</p>' +
        '<div class="notice" style="margin:23px 0"><strong>Order Number: #' + order.id + '</strong><br>Amount to Pay at Pickup: ' + money(order.total) + '<br>Pickup: ' + escapeHTML(order.pickupTime) + '</div>' +
        '<div class="button-row" style="justify-content:center"><button class="btn btn-primary" onclick="openOrder(' + order.id + ')">Track My Order</button><button class="btn btn-outline" onclick="showPage(\'menu\')">Order Again</button></div></div>';
    }

    // 7. Student order tracking and cancellation
    function statusBadge(status) {
      var names = { "Pending": "pending", "Preparing": "preparing", "Ready for Pickup": "ready", "Completed": "completed", "Cancelled": "cancelled" };
      var icons = { 'Pending': 'clock', 'Preparing': 'whisk', 'Ready for Pickup': 'bell', 'Completed': 'check', 'Cancelled': 'logout' };
      return '<span class="status status-' + (names[status] || "pending") + '">' + solarIcon(icons[status] || 'clock') + escapeHTML(status) + '</span>';
    }

    function renderOrders() {
      var myOrders = getMyOrders();
      myOrders.sort(function (a, b) { return b.id - a.id; });
      var html = '<div class="page-intro"><span class="eyebrow">Order Tracking</span><h1>My Orders</h1><p>Track your current orders and review previous purchases.</p></div>';
      if (!myOrders.length) return html + '<div class="empty"><div class="big-icon">' + solarIcon("orders") + '</div><h3>No orders yet</h3><p>When you order food, its status will appear here.</p><button class="btn btn-primary" onclick="showPage(\'menu\')">Browse Food Menu</button></div>';
      for (var i = 0; i < myOrders.length; i++) {
        var order = myOrders[i];
        html += '<article class="order-card"><div class="order-head"><div><h3>Order #' + order.id + '</h3><div class="muted small">' + formatDate(order.createdAt) + '</div></div>' + statusBadge(order.status) + '</div>' +
          '<div class="order-items">' + escapeHTML(orderItemSummary(order)) + '</div><div class="order-foot"><strong>' + money(order.total) + '</strong><button class="btn btn-outline btn-sm" onclick="openOrder(' + order.id + ')">View Details</button></div></article>';
      }
      return html;
    }

    function orderItemSummary(order) {
      var names = [];
      for (var i = 0; i < order.items.length; i++) names.push(order.items[i].quantity + "× " + order.items[i].name);
      return names.join(" · ");
    }

    function openOrder(id) {
      var order = findOrder(id);
      if (!order || (currentUser.role === "student" && order.studentId !== currentUser.id)) {
        showToast("Order not found.", true);
        return;
      }
      selectedOrderId = id;
      showPage(currentUser.role === "student" ? "order-details" : "staff-orders");
    }

    function renderOrderDetails() {
      var order = findOrder(selectedOrderId);
      if (!order || order.studentId !== currentUser.id) return '<div class="empty">Order not found. <button class="btn btn-outline" onclick="showPage(\'orders\')">My Orders</button></div>';
      var items = '';
      for (var i = 0; i < order.items.length; i++) {
        var item = order.items[i];
        items += '<div class="summary-row"><span>' + item.quantity + ' × ' + escapeHTML(item.name) + '</span><strong>' + money(item.price * item.quantity) + '</strong></div>';
      }
      var stages = ["Pending", "Preparing", "Ready for Pickup", "Completed"];
      var currentStage = stages.indexOf(order.status);
      var steps = '<div class="order-timeline">';
      for (var j = 0; j < stages.length; j++) steps += '<div class="timeline-step ' + (currentStage >= j ? 'done' : '') + '"><span class="bubble">' + (currentStage >= j ? solarIcon('check') : j + 1) + '</span><span class="caption">' + stages[j] + '</span></div>';
      steps += '</div>';
      return '<div class="page-intro"><span class="eyebrow">Order Details</span><h1>Order #' + order.id + '</h1><p>Submitted ' + formatDate(order.createdAt) + '</p></div>' +
        '<div class="cart-layout"><div class="card"><div class="order-head"><h2>Order Status</h2>' + statusBadge(order.status) + '</div>' +
        (order.status === "Cancelled" ? '<div class="notice" style="background:#FFF3F3;color:#9D2832;border-color:#FFE0E0">This order has been cancelled.</div>' : steps) +
        '<div class="divider"></div><h3>Pickup Information</h3><p><strong>Name:</strong> ' + escapeHTML(order.pickupName) + '<br><strong>Preferred Time:</strong> ' + escapeHTML(order.pickupTime) + '<br><strong>Payment:</strong> Pay at Pickup</p>' +
        (order.notes ? '<p><strong>Instructions:</strong> ' + escapeHTML(order.notes) + '</p>' : '') + '</div>' +
        '<div class="card"><h3>Food Items</h3><div class="divider"></div>' + items + '<div class="divider"></div><div class="summary-row"><strong>Total</strong><span class="summary-total">' + money(order.total) + '</span></div>' +
        '<button class="btn btn-outline btn-block" onclick="showPage(\'orders\')">Back to My Orders</button>' +
        (order.status === "Pending" ? '<button class="btn btn-danger btn-block" style="margin-top:10px" onclick="cancelMyOrder(' + order.id + ')">Cancel Order</button>' : '') + '</div></div>';
    }

    function cancelMyOrder(id) {
      var order = findOrder(id);
      if (!order || order.studentId !== currentUser.id || order.status !== "Pending") return;
      if (!confirm("Cancel order #" + id + "?")) return;
      order.status = "Cancelled";
      saveData();
      renderApp();
      showToast("Order #" + id + " cancelled.");
    }

    // 8. Staff order processing
    function renderStaffOrders() {
      var html = '<div class="page-intro"><span class="eyebrow">Canteen Operations</span><h1>Order Management</h1><p>Review incoming orders and move each order through the preparation process.</p></div>' +
        '<div class="filter-bar">';
      var filters = ["All", "Pending", "Preparing", "Ready for Pickup", "Completed", "Cancelled"];
      for (var i = 0; i < filters.length; i++) html += '<button class="chip ' + (staffFilter === filters[i] ? 'selected' : '') + '" aria-pressed="' + (staffFilter === filters[i] ? 'true' : 'false') + '" onclick="changeStaffFilter(\'' + filters[i] + '\')">' + filters[i] + '</button>';
      html += '</div>';
      var filtered = [];
      for (var j = 0; j < orders.length; j++) if (staffFilter === "All" || staffFilter === orders[j].status) filtered.push(orders[j]);
      filtered.sort(function (a, b) { return b.id - a.id; });
      if (!filtered.length) return html + '<div class="empty"><div class="big-icon">' + solarIcon("orders") + '</div><h3>No matching orders</h3><p>Orders submitted by students will appear here.</p></div>';
      for (var k = 0; k < filtered.length; k++) {
        var order = filtered[k];
        var student = findUser(order.studentId);
        var next = nextStatus(order.status);
        html += '<article class="order-card staff-card"><div class="order-head"><div><h3>Order #' + order.id + '</h3><span class="muted small">' + formatDate(order.createdAt) + ' · ' + escapeHTML(student ? student.name : "Student") + '</span></div>' + statusBadge(order.status) + '</div>' +
          '<div class="order-items">' + escapeHTML(orderItemSummary(order)) + '</div><div class="muted small">Pickup: ' + escapeHTML(order.pickupName) + ' · ' + escapeHTML(order.pickupTime) +
          (order.notes ? '<br>Instructions: ' + escapeHTML(order.notes) : '') + '</div><div class="order-foot"><strong>' + money(order.total) + '</strong><div class="button-row">' +
          (next ? '<button class="btn btn-primary btn-sm" onclick="advanceOrder(' + order.id + ')">' + next + '</button>' : '') +
          (order.status === "Pending" ? '<button class="btn btn-danger btn-sm" onclick="cancelStaffOrder(' + order.id + ')">Cancel</button>' : '') + '</div></div></article>';
      }
      return html;
    }

    function nextStatus(status) {
      if (status === "Pending") return "Preparing";
      if (status === "Preparing") return "Ready for Pickup";
      if (status === "Ready for Pickup") return "Completed";
      return "";
    }

    function advanceOrder(id) {
      if (!currentUser || currentUser.role === "student") return;
      var order = findOrder(id);
      if (!order) return;
      var next = nextStatus(order.status);
      if (!next) return;
      order.status = next;
      saveData();
      renderApp();
      showToast("Order #" + id + " is now " + next + ".");
    }

    function cancelStaffOrder(id) {
      if (!currentUser || currentUser.role === "student") return;
      var order = findOrder(id);
      if (!order || order.status !== "Pending") return;
      if (!confirm("Cancel order #" + id + "?")) return;
      order.status = "Cancelled";
      saveData();
      renderApp();
      showToast("Order #" + id + " cancelled.");
    }

    function changeStaffFilter(filter) {
      staffFilter = filter;
      renderApp();
    }

    // 9. Administrator food menu management
    function renderManageMenu() {
      var food = findFood(editingItemId);
      var heading = food ? "Edit Food Item" : "Add Food Item";
      var html = '<div class="page-intro"><span class="eyebrow">Administrator Tools</span><h1>Menu Management</h1><p>Add food, update prices, and control which items students can order.</p></div>' +
        '<div class="card" style="margin-bottom:20px"><h2>' + heading + '</h2><div class="divider"></div><form onsubmit="saveFoodItem(event)">' +
        '<div class="form-row"><div class="form-field"><label for="item-name">Food Name</label><input id="item-name" required maxlength="60" placeholder="e.g., Beef Tapa Rice" value="' + escapeHTML(food ? food.name : '') + '"></div>' +
        '<div class="form-field"><label for="item-price">Price (₱)</label><input id="item-price" type="number" min="1" max="10000" step="0.01" required placeholder="75.00" value="' + (food ? food.price : '') + '"></div></div>' +
        '<div class="form-row"><div class="form-field"><label for="item-category">Category</label><select id="item-category">';
      var categories = ["Meals", "Snacks", "Drinks", "Desserts"];
      for (var i = 0; i < categories.length; i++) html += '<option value="' + categories[i] + '" ' + (food && food.category === categories[i] ? 'selected' : '') + '>' + categories[i] + '</option>';
      html += '</select></div><div class="form-field"><label for="item-icon">Food Icon (Solar)</label><select id="item-icon"><option value="whisk">Meal / Utensil</option><option value="bag">Snack / Food Bag</option><option value="cup">Cup / Drink</option><option value="tea">Tea / Hot Drink</option><option value="donut">Dessert / Donut</option></select></div></div>' +
        '<div class="form-field"><label for="item-photo">Food Photo URL (HTTPS)</label>' +
        '<input id="item-photo" type="url" maxlength="400" placeholder="https://example.com/my-food-photo.jpg" ' +
        'value="' + escapeHTML(food ? foodPhoto(food) : '') + '" ' + (food ? '' : 'required') + '>' +
        '<small class="muted">Use a photo of the actual food. New items need a photo URL. ' +
        'Photos from Wikimedia Commons may require attribution.</small></div>' +
        '<div class="form-field"><label for="item-description">Description</label><textarea id="item-description" required maxlength="180" placeholder="Describe the food item">' + escapeHTML(food ? food.description : '') + '</textarea></div>' +
        '<div class="button-row"><button type="submit" class="btn btn-primary">' + (food ? 'Save Changes' : 'Add Food Item') + '</button>' +
        (food ? '<button type="button" class="btn btn-outline" onclick="clearFoodEditor()">Cancel Editing</button>' : '') + '</div></form></div>' +
        '<div class="card"><div class="section-head"><h2>Food Menu (' + menu.length + ')</h2></div><div class="table-wrap"><table><thead><tr><th>Food</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
      for (var j = 0; j < menu.length; j++) {
        var item = menu[j];
        html += '<tr><td><span class="inline-photo">' + photoElement(item, 'admin-photo') + '</span> <strong>' + escapeHTML(item.name) + '</strong></td><td>' + escapeHTML(item.category) + '</td><td>' + money(item.price) + '</td><td>' +
          (item.available ? '<span class="status status-completed">Available</span>' : '<span class="status status-cancelled">Unavailable</span>') + '</td><td><div class="button-row">' +
          '<button class="btn btn-outline btn-sm" onclick="editFoodItem(' + item.id + ')">Edit</button>' +
          '<button class="btn ' + (item.available ? 'btn-danger' : 'btn-soft') + ' btn-sm" onclick="toggleFoodAvailability(' + item.id + ')">' + (item.available ? 'Disable' : 'Enable') + '</button></div></td></tr>';
      }
      html += '</tbody></table></div></div>';
      return html;
    }

    function selectSavedIcon() {
      var food = findFood(editingItemId);
      var input = document.getElementById("item-icon");
      if (food && input) input.value = foodIcon(food);
    }

    function saveFoodItem(event) {
      event.preventDefault();
      if (!currentUser || currentUser.role !== "admin") return;
      var name = document.getElementById("item-name").value.trim();
      var price = Number(document.getElementById("item-price").value);
      var category = document.getElementById("item-category").value;
      var selectedIcon = document.getElementById("item-icon").value;
      var description = document.getElementById("item-description").value.trim();
      var photoUrl = document.getElementById("item-photo").value.trim();
      if (!name || !description || !selectedIcon || !isFinite(price) || price < 1 || price > 10000) {
        showToast("Enter a valid food name, description, icon, and price.", true);
        return;
      }
      if (!/^https:\/\/[^\s\"'<>]+$/i.test(photoUrl)) {
        showToast("Enter a valid HTTPS photograph URL.", true);
        return;
      }
      if (editingItemId !== null) {
        var existing = findFood(editingItemId);
        if (!existing) return;
        existing.name = name;
        existing.price = price;
        existing.category = category;
        existing.icon = selectedIcon;
        existing.description = description;
        existing.photoUrl = photoUrl;
      } else {
        var newId = 1;
        for (var i = 0; i < menu.length; i++) if (menu[i].id >= newId) newId = menu[i].id + 1;
        menu.push({ id: newId, name: name, price: price, category: category, icon: selectedIcon,
                    description: description, photoUrl: photoUrl, available: true });
      }
      editingItemId = null;
      saveData();
      renderApp();
      showToast("Food menu saved successfully.");
    }

    function editFoodItem(id) {
      if (!currentUser || currentUser.role !== "admin") return;
      editingItemId = id;
      renderApp();
      selectSavedIcon();
      window.scrollTo(0, 0);
      document.getElementById("item-name").focus();
    }

    function clearFoodEditor() {
      editingItemId = null;
      renderApp();
    }

    function toggleFoodAvailability(id) {
      if (!currentUser || currentUser.role !== "admin") return;
      var food = findFood(id);
      if (!food) return;
      food.available = !food.available;
      saveData();
      renderApp();
      showToast(food.name + (food.available ? " is now available." : " is now unavailable."));
    }

    // 10. Basic profile page
    function renderProfile() {
      return '<div class="page-intro"><span class="eyebrow">Your Account</span><h1>My Profile</h1><p>View and update your demonstration account information.</p></div>' +
        '<div class="card profile-card"><div class="profile-header"><div class="avatar">' + initials(currentUser.name) + '</div><div><h2>' + escapeHTML(currentUser.name) + '</h2><div class="muted small" style="margin-top:5px;text-transform:capitalize">' + escapeHTML(currentUser.role) + ' Account</div></div></div>' +
        '<form onsubmit="updateProfile(event)"><div class="form-field"><label for="profile-name">Full Name</label><input id="profile-name" required maxlength="70" value="' + escapeHTML(currentUser.name) + '"></div>' +
        '<div class="form-field"><label>Email Address</label><input disabled value="' + escapeHTML(currentUser.email) + '"></div>' +
        (currentUser.studentId ? '<div class="form-field"><label>Student ID</label><input disabled value="' + escapeHTML(currentUser.studentId) + '"></div>' : '') +
        '<button class="btn btn-primary" type="submit">Save Profile</button></form><div class="divider"></div>' +
        '<button class="btn btn-outline" onclick="logout()">Sign Out</button></div>';
    }

    function updateProfile(event) {
      event.preventDefault();
      var newName = document.getElementById("profile-name").value.trim();
      if (!newName) { showToast("Name cannot be empty.", true); return; }
      currentUser.name = newName;
      saveData();
      renderApp();
      showToast("Profile updated successfully.");
    }

    // 11. Start the application
    currentUser = findUser(currentUserId);
    renderApp();
  </script>
</body>
</html>
