    function dashboardFoodArtwork() {
        return '<div class="hero-dish-collage" aria-hidden="true">' +
            '<img class="hero-dish-primary" src="' + dashboardInasalPhoto + '" alt="">' +
            '<img class="hero-dish-secondary" src="' + dashboardHaloHaloPhoto + '" alt="">' +
            '</div>';
    }
    function renderDashboard() {
        if (currentUser.role !== "student") {
            var active = 0;
            var ready = 0;
            for (var i = 0; i < orders.length; i++) {
                if (orders[i].status === "Pending" || orders[i].status === "Preparing") {
                    active++;
                }
                if (orders[i].status === "Ready for Pickup") {
                    ready++;
                }
            }
            return '<div class="hero"><div><div class="eyebrow">Canteen Operations</div><h1>Welcome back, ' + escapeHTML(currentUser.name.split(" ")[0]) + '!</h1>' +
                '<p>View student orders, update their status, and keep the canteen running smoothly.</p>' +
                    '<button class="btn btn-yellow" onclick="showPage(\'staff-orders\')">Manage Orders</button></div>' +
                    '<div class="hero-art" aria-hidden="true">' + solarIcon('chef') + '</div></div>' +
                '<div class="stat-grid"><div class="stat"><span class="stat-icon">' + solarIcon("orders") + '</span><span>Total Orders</span><strong>' + orders.length + '</strong></div>' +
                '<div class="stat"><span class="stat-icon">' + solarIcon("whisk") + '</span><span>Pending / Preparing</span><strong>' + active + '</strong></div>' +
                '<div class="stat"><span class="stat-icon">' + solarIcon("check") + '</span><span>Ready for Pickup</span><strong>' + ready + '</strong></div></div>' +
                '<div class="card"><h3>Quick Actions</h3>' +
                    '<p class="muted">Process incoming orders from the order management screen.</p>' +
                    '<div class="button-row">' +
                '<button class="btn btn-primary" onclick="showPage(\'staff-orders\')">Open Orders</button>' +
                (currentUser.role === "admin" ? '<button class="btn btn-outline" onclick="showPage(\'manage-menu\')">Manage Food Menu</button>' : '') + '</div></div>';
        }
        var myOrders = getMyOrders();
        var activeOrders = 0;
        var completed = 0;
        for (var j = 0; j < myOrders.length; j++) {
            if (myOrders[j].status === "Pending" || myOrders[j].status === "Preparing" || myOrders[j].status === "Ready for Pickup") {
                activeOrders++;
            }
            if (myOrders[j].status === "Completed") {
                completed++;
            }
        }
        var featured = '<div class="food-grid">';
        var shown = 0;
        for (var k = 0; k < menu.length && shown < 3; k++) {
            if (menu[k].available) {
                featured += foodCard(menu[k]);
                shown++;
            }
        }
        featured += '</div>';
        return '<div class="hero"><div><div class="eyebrow">Your Campus Food Hub</div><h1>Hi, ' + escapeHTML(currentUser.name.split(" ")[0]) + '! Hungry?</h1>' +
            '<p>Skip the long line. Find your favorite meal, order it here, and pick it up when ready.</p>' +
                '<button class="btn btn-yellow" onclick="showPage(\'menu\')">Browse Food Menu</button></div>' + dashboardFoodArtwork() + '</div>' +
            '<div class="stat-grid"><div class="stat"><span class="stat-icon">' + solarIcon("chef") + '</span><span>Available Food Items</span><strong>' + availableMenuCount() + '</strong></div>' +
            '<div class="stat"><span class="stat-icon">' + solarIcon("bag") + '</span><span>Active Orders</span><strong>' + activeOrders + '</strong></div>' +
            '<div class="stat"><span class="stat-icon">' + solarIcon("check") + '</span><span>Completed Orders</span><strong>' + completed + '</strong></div></div>' +
            '<div class="section-head"><h2>Popular Picks</h2>' +
                '<button class="btn btn-outline btn-sm" onclick="showPage(\'menu\')">View All Food</button></div>' +
            (shown ? featured : '<div class="empty">The menu is currently unavailable.</div>') +
            '<div class="section-head"><h2>How to Order</h2></div><div class="card"><div class="steps">' +
            '<div class="step"><div class="step-number">1</div><div><strong>Browse the menu</strong>' +
                '<p>Choose from the food and drinks offered in the canteen.</p></div></div>' +
            '<div class="step"><div class="step-number">2</div><div>' +
                '<strong>Add your favorites to the cart</strong><p>Choose quantities and check your total.</p></div>' +
                '</div>' +
            '<div class="step"><div class="step-number">3</div><div><strong>Confirm and track your order</strong>' +
                '<p>Pay at pickup and monitor your order status.</p></div></div></div></div>';
    }
    function availableMenuCount() {
        var count = 0;
        for (var i = 0; i < menu.length; i++) {
            if (menu[i].available) {
                count++;
            }
        }
        return count;
    }
    function foodCard(food) {
        var category = food.category.toLowerCase();
        return '<article class="food-card"><div class="food-picture ' + category + '">' +
            photoElement(food, 'photo-area') + '<div class="food-tag">' + escapeHTML(food.category) + '</div></div>' +
            '<div class="food-info"><h3>' + escapeHTML(food.name) + '</h3><p>' + escapeHTML(food.description) + '</p>' +
            '<div class="food-card-bottom"><span class="price">' + money(food.price) + '</span>' +
            '<button class="btn btn-primary btn-sm" onclick="addToCart(' + food.id + ')">' + solarIcon("plus") + ' Add to Cart</button></div></div></article>';
    }
    function renderMenu() {
        return '<div class="page-intro"><span class="eyebrow">Explore Our Food</span>' +
            '<h1>What would you like to eat?</h1>' +
            '<p>Fresh, affordable meals for your campus day. All prices are in Philippine pesos.</p></div>' +
            '<div class="menu-tools"><div class="search-field">' + solarIcon("search") + '<input class="search-box" id="food-search" aria-label="Search food" placeholder="Search food or drink..." oninput="searchMenu()" value="' + escapeHTML(searchText) + '"></div>' +
            '<button class="btn btn-outline" onclick="showPage(\'cart\')">' + solarIcon("cart") + ' View Cart (' + cartCount() + ')</button></div>' +
            '<div class="chips" id="category-chips">' + categoryButtons() + '</div>' +
            '<div class="section-head"><h2>Available Menu</h2><span class="muted small" id="result-count"></span>' +
                '</div><div class="food-grid" id="food-results"></div>';
    }
    function categoryButtons() {
        var categories = ["All", "Meals", "Snacks", "Drinks", "Desserts"];
        var html = '';
        for (var i = 0; i < categories.length; i++) {
            html += '<button class="chip ' + (categories[i] === selectedCategory ? 'selected' : '') + '" aria-pressed="' + (categories[i] === selectedCategory ? 'true' : 'false') + '" onclick="selectCategory(\'' + categories[i] + '\')">' + categories[i] + '</button>';
        }
        return html;
    }
    function searchMenu() {
        searchText = document.getElementById("food-search").value;
        updateMenuResults();
    }
    function selectCategory(category) {
        selectedCategory = category;
        document.getElementById("category-chips").innerHTML = categoryButtons();
        updateMenuResults();
    }
    function updateMenuResults() {
        var container = document.getElementById("food-results");
        if (!container) {
            return;
        }
        var html = '';
        var count = 0;
        var query = searchText.toLowerCase();
        for (var i = 0; i < menu.length; i++) {
            var food = menu[i];
            if (!food.available) {
                continue;
            }
            if (selectedCategory !== "All" && selectedCategory !== food.category) {
                continue;
            }
            if (food.name.toLowerCase().indexOf(query) === -1 && food.description.toLowerCase().indexOf(query) === -1) {
                continue;
            }
            html += foodCard(food);
            count++;
        }
        container.innerHTML = count ? html : '<div class="empty" style="grid-column:1/-1"><div class="big-icon">' + solarIcon("search") + '</div><h3>No matching food</h3><p>Try a different keyword or category.</p>' +
            '<button class="btn btn-outline" onclick="clearMenuSearch()">Clear Filters</button></div>';
        document.getElementById("result-count").textContent = count + " item(s)";
    }
    function clearMenuSearch() {
        selectedCategory = "All";
        searchText = "";
        renderApp();
        updateMenuResults();
    }
    // 6. Student cart and checkout
    function addToCart(foodId) {
        if (!currentUser || currentUser.role !== "student") {
            return;
        }
        var food = findFood(foodId);
        if (!food || !food.available) {
            showToast("Sorry, this item is currently unavailable.", true);
            return;
        }
        for (var i = 0; i < cart.length; i++) {
            if (cart[i].foodId === foodId) {
                cart[i].quantity++;
                showToast(food.name + " added to your cart.");
                renderApp();
                updateMenuResults();
                return;
            }
        }
        cart.push({ foodId: foodId, quantity: 1 });
        showToast(food.name + " added to your cart.");
        renderApp();
        updateMenuResults();
    }
    function changeQuantity(foodId, amount) {
        for (var i = 0; i < cart.length; i++) {
            if (cart[i].foodId === foodId) {
                cart[i].quantity += amount;
                if (cart[i].quantity <= 0) {
                    cart.splice(i, 1);
                }
                break;
            }
        }
        renderApp();
    }
    function removeFromCart(foodId) {
        for (var i = 0; i < cart.length; i++) {
            if (cart[i].foodId === foodId) {
                cart.splice(i, 1);
                break;
            }
        }
        renderApp();
    }
    function renderCart() {
        if (!cart.length) {
            return '<div class="page-intro"><h1>My Cart</h1><p>Review your selected food before checkout.</p></div>' +
                '<div class="empty"><div class="big-icon">' + solarIcon("cart") + '</div><h3>Your cart is empty</h3><p>Explore our menu and add something delicious.</p>' +
                    '<button class="btn btn-primary" onclick="showPage(\'menu\')">Browse Menu</button></div>';
        }
        var items = '';
        for (var i = 0; i < cart.length; i++) {
            var food = findFood(cart[i].foodId);
            if (!food) {
                continue;
            }
            items += '<div class="cart-line"><div class="line-image">' + photoElement(food, 'cart-photo') + '</div><div class="line-info"><h3>' + escapeHTML(food.name) + '</h3><div class="muted">' + money(food.price) + ' each</div>' +
                '<div class="qty-controls" style="margin-top:10px"><button aria-label="Decrease quantity" onclick="changeQuantity(' + food.id + ', -1)">−</button><span>' + cart[i].quantity + '</span><button aria-label="Increase quantity" onclick="changeQuantity(' + food.id + ', 1)">+</button></div></div>' +
                '<div class="line-price"><strong>' + money(food.price * cart[i].quantity) + '</strong><button class="plain-link" onclick="removeFromCart(' + food.id + ')">Remove</button></div></div>';
        }
        return '<div class="page-intro"><span class="eyebrow">Your Order</span><h1>My Cart</h1>' +
            '<p>Review quantities and proceed when you are ready.</p></div>' +
            '<div class="cart-layout"><div class="card"><h2>Selected Food (' + cartCount() + ')</h2>' + items + '<div class="button-row" style="margin-top:17px">' +
                '<button class="btn btn-outline" onclick="showPage(\'menu\')">Continue Shopping</button></div></div>' +
            '<div class="card"><h3>Order Summary</h3><div class="divider"></div><div class="summary-row"><span class="muted">Items</span><strong>' + cartCount() + '</strong></div>' +
            '<div class="summary-row"><span class="muted">Subtotal</span><strong>' + money(cartTotal()) + '</strong></div><div class="summary-row"><span class="muted">Service Fee</span><strong>Free</strong></div>' +
            '<div class="divider"></div><div class="summary-row"><strong>Total</strong><span class="summary-total">' + money(cartTotal()) + '</span></div>' +
            '<button class="btn btn-primary btn-block" onclick="showPage(\'checkout\')">Proceed to Checkout</button></div></div>';
    }
    function renderCheckout() {
        if (!cart.length) {
            currentPage = "cart";
            return renderCart();
        }
        var items = '';
        for (var i = 0; i < cart.length; i++) {
            var food = findFood(cart[i].foodId);
            if (food) {
                items += '<div class="summary-row"><span>' + cart[i].quantity + ' × ' + escapeHTML(food.name) + '</span><strong>' + money(food.price * cart[i].quantity) + '</strong></div>';
            }
        }
        return '<div class="page-intro"><span class="eyebrow">Almost Done</span><h1>Confirm Your Order</h1>' +
            '<p>Check your details before submitting your order.</p></div>' +
            '<form onsubmit="submitOrder(event)"><div class="cart-layout"><div class="card">' +
                '<h2>Pickup Information</h2>' +
                '<p class="muted small">Please collect your order at the UC campus canteen.</p><div class="divider">' +
                '</div>' +
            '<div class="form-field"><label for="pickup-name">Pickup Name</label><input id="pickup-name" maxlength="70" value="' + escapeHTML(currentUser.name) + '" required></div>' +
            '<div class="form-field"><label for="pickup-time">Pickup Preference</label><select id="pickup-time">' +
                '<option value="As soon as ready">As soon as ready</option>' +
                '<option value="Around 15 minutes">Around 15 minutes</option>' +
                '<option value="Around 30 minutes">Around 30 minutes</option></select></div>' +
            '<div class="form-field"><label for="order-notes">Special Instructions (optional)</label>' +
                '<textarea id="order-notes" maxlength="200" placeholder="e.g., No spicy sauce"></textarea></div>' +
            '<div class="notice"><span class="payment-icon">' + solarIcon("bag") + '</span><strong>Payment Method: Pay at Pickup</strong><br>This student demonstration does not process online payments.</div></div>' +
            '<div class="card"><h3>Order Summary</h3><div class="divider"></div>' + items + '<div class="divider"></div><div class="summary-row"><strong>Total to Pay</strong><span class="summary-total">' + money(cartTotal()) + '</span></div>' +
            '<button type="submit" class="btn btn-primary btn-block">' + solarIcon("check") + ' Place Order</button>' +
                '<button type="button" class="btn btn-outline btn-block" style="margin-top:9px" onclick="showPage(\'cart\')">Back to Cart</button>' +
                '</div></div></form>';
    }
    function submitOrder(event) {
        event.preventDefault();
        if (!currentUser || currentUser.role !== "student" || !cart.length) {
            return;
        }
        var pickupName = document.getElementById("pickup-name").value.trim();
        var pickupTime = document.getElementById("pickup-time").value;
        var notes = document.getElementById("order-notes").value.trim();
        if (!pickupName) {
            showToast("Please provide a pickup name.", true);
            return;
        }
        var orderItems = [];
        var total = 0;
        for (var i = 0; i < cart.length; i++) {
            var food = findFood(cart[i].foodId);
            if (!food || !food.available) {
                showToast("An item in your cart is unavailable. Please update your cart.", true);
                return;
            }
            orderItems.push({
                foodId: food.id,
                name: food.name,
                price: food.price,
                quantity: cart[i].quantity
            });
            total += food.price * cart[i].quantity;
        }
        var newId = 1001;
        for (var j = 0; j < orders.length; j++) {
            if (orders[j].id >= newId) {
                newId = orders[j].id + 1;
            }
        }
        orders.push({
            id: newId,
            studentId: currentUser.id,
            pickupName: pickupName,
            pickupTime: pickupTime,
            notes: notes,
            items: orderItems,
            total: total,
            status: "Pending",
            createdAt: new Date().toISOString()
        });
        lastOrderId = newId;
        cart = [];
        saveData();
        showPage("confirmation");
        showToast("Order #" + newId + " placed successfully!");
    }
    function renderConfirmation() {
        var order = findOrder(lastOrderId);
        if (!order || order.studentId !== currentUser.id) {
            return renderOrders();
        }
        return '<div class="card center" style="max-width:620px;margin:35px auto;padding:40px 25px"><div class="success-illustration">' + solarIcon("check") + '</div><span class="eyebrow">Order Submitted</span>' +
            '<h1>Your order is confirmed!</h1><p class="muted">The canteen has received your order. Check My Orders for its preparation status.</p>' +
            '<div class="notice" style="margin:23px 0"><strong>Order Number: #' + order.id + '</strong><br>Amount to Pay at Pickup: ' + money(order.total) + '<br>Pickup: ' + escapeHTML(order.pickupTime) + '</div>' +
            '<div class="button-row" style="justify-content:center"><button class="btn btn-primary" onclick="openOrder(' + order.id + ')">Track My Order</button><button class="btn btn-outline" onclick="showPage(\'menu\')">Order Again</button></div></div>';
    }
    // 7. Student order tracking and cancellation
    function statusBadge(status) {
        var names = {
            "Pending": "pending",
            "Preparing": "preparing",
            "Ready for Pickup": "ready",
            "Completed": "completed",
            "Cancelled": "cancelled"
        };
        var icons = {
            'Pending': 'clock',
            'Preparing': 'whisk',
            'Ready for Pickup': 'bell',
            'Completed': 'check',
            'Cancelled': 'logout'
        };
        return '<span class="status status-' + (names[status] || "pending") + '">' + solarIcon(icons[status] || 'clock') + escapeHTML(status) + '</span>';
    }
    function renderOrders() {
        var myOrders = getMyOrders();
        myOrders.sort(function (a, b) { return b.id - a.id; });
        var html = '<div class="page-intro"><span class="eyebrow">Order Tracking</span><h1>My Orders</h1>' +
            '<p>Track your current orders and review previous purchases.</p></div>';
        if (!myOrders.length) {
            return html + '<div class="empty"><div class="big-icon">' + solarIcon("orders") + '</div><h3>No orders yet</h3><p>When you order food, its status will appear here.</p>' +
                '<button class="btn btn-primary" onclick="showPage(\'menu\')">Browse Food Menu</button></div>';
        }
        for (var i = 0; i < myOrders.length; i++) {
            var order = myOrders[i];
            html += '<article class="order-card"><div class="order-head"><div><h3>Order #' + order.id + '</h3><div class="muted small">' + formatDate(order.createdAt) + '</div></div>' + statusBadge(order.status) + '</div>' +
                '<div class="order-items">' + escapeHTML(orderItemSummary(order)) + '</div><div class="order-foot"><strong>' + money(order.total) + '</strong><button class="btn btn-outline btn-sm" onclick="openOrder(' + order.id + ')">View Details</button></div></article>';
        }
        return html;
    }
    function orderItemSummary(order) {
        var names = [];
        for (var i = 0; i < order.items.length; i++) {
            names.push(order.items[i].quantity + "× " + order.items[i].name);
        }
        return names.join(" · ");
    }
    function openOrder(id) {
        var order = findOrder(id);
        if (!order || (currentUser.role === "student" && order.studentId !== currentUser.id)) {
            showToast("Order not found.", true);
            return;
        }
        selectedOrderId = id;
        showPage(currentUser.role === "student" ? "order-details" : "staff-orders");
    }
    function renderOrderDetails() {
        var order = findOrder(selectedOrderId);
        if (!order || order.studentId !== currentUser.id) {
            return '<div class="empty">Order not found. <button class="btn btn-outline" onclick="showPage(\'orders\')">My Orders</button></div>';
        }
        var items = '';
        for (var i = 0; i < order.items.length; i++) {
            var item = order.items[i];
            items += '<div class="summary-row"><span>' + item.quantity + ' × ' + escapeHTML(item.name) + '</span><strong>' + money(item.price * item.quantity) + '</strong></div>';
        }
        var stages = ["Pending", "Preparing", "Ready for Pickup", "Completed"];
        var currentStage = stages.indexOf(order.status);
        var steps = '<div class="order-timeline">';
        for (var j = 0; j < stages.length; j++) {
            steps += '<div class="timeline-step ' + (currentStage >= j ? 'done' : '') + '"><span class="bubble">' + (currentStage >= j ? solarIcon('check') : j + 1) + '</span><span class="caption">' + stages[j] + '</span></div>';
        }
        steps += '</div>';
        return '<div class="page-intro"><span class="eyebrow">Order Details</span><h1>Order #' + order.id + '</h1><p>Submitted ' + formatDate(order.createdAt) + '</p></div>' +
            '<div class="cart-layout"><div class="card"><div class="order-head"><h2>Order Status</h2>' + statusBadge(order.status) + '</div>' +
            (order.status === "Cancelled" ? '<div class="notice" style="background:#FFF3F3;color:#9D2832;border-color:#FFE0E0">This order has been cancelled.</div>' : steps) +
            '<div class="divider"></div><h3>Pickup Information</h3><p><strong>Name:</strong> ' + escapeHTML(order.pickupName) + '<br><strong>Preferred Time:</strong> ' + escapeHTML(order.pickupTime) + '<br><strong>Payment:</strong> Pay at Pickup</p>' +
            (order.notes ? '<p><strong>Instructions:</strong> ' + escapeHTML(order.notes) + '</p>' : '') + '</div>' +
            '<div class="card"><h3>Food Items</h3><div class="divider"></div>' + items + '<div class="divider"></div><div class="summary-row"><strong>Total</strong><span class="summary-total">' + money(order.total) + '</span></div>' +
            '<button class="btn btn-outline btn-block" onclick="showPage(\'orders\')">Back to My Orders</button>' +
            (order.status === "Pending" ? '<button class="btn btn-danger btn-block" style="margin-top:10px" onclick="cancelMyOrder(' + order.id + ')">Cancel Order</button>' : '') + '</div></div>';
    }
    function cancelMyOrder(id) {
        var order = findOrder(id);
        if (!order || order.studentId !== currentUser.id || order.status !== "Pending") {
            return;
        }
        if (!confirm("Cancel order #" + id + "?")) {
            return;
        }
        order.status = "Cancelled";
        saveData();
        renderApp();
        showToast("Order #" + id + " cancelled.");
    }
    // 8. Staff order processing
    function renderStaffOrders() {
        var html = '<div class="page-intro"><span class="eyebrow">Canteen Operations</span><h1>Order Management</h1>' +
            '<p>Review incoming orders and move each order through the preparation process.</p></div>' +
            '<div class="filter-bar">';
        var filters = ["All", "Pending", "Preparing", "Ready for Pickup", "Completed", "Cancelled"];
        for (var i = 0; i < filters.length; i++) {
            html += '<button class="chip ' + (staffFilter === filters[i] ? 'selected' : '') + '" aria-pressed="' + (staffFilter === filters[i] ? 'true' : 'false') + '" onclick="changeStaffFilter(\'' + filters[i] + '\')">' + filters[i] + '</button>';
        }
        html += '</div>';
        var filtered = [];
        for (var j = 0; j < orders.length; j++) {
            if (staffFilter === "All" || staffFilter === orders[j].status) {
                filtered.push(orders[j]);
            }
        }
        filtered.sort(function (a, b) { return b.id - a.id; });
        if (!filtered.length) {
            return html + '<div class="empty"><div class="big-icon">' + solarIcon("orders") + '</div><h3>No matching orders</h3><p>Orders submitted by students will appear here.</p></div>';
        }
        for (var k = 0; k < filtered.length; k++) {
            var order = filtered[k];
            var student = findUser(order.studentId);
            var next = nextStatus(order.status);
            html += '<article class="order-card staff-card"><div class="order-head"><div><h3>Order #' + order.id + '</h3><span class="muted small">' + formatDate(order.createdAt) + ' · ' + escapeHTML(student ? student.name : "Student") + '</span></div>' + statusBadge(order.status) + '</div>' +
                '<div class="order-items">' + escapeHTML(orderItemSummary(order)) + '</div><div class="muted small">Pickup: ' + escapeHTML(order.pickupName) + ' · ' + escapeHTML(order.pickupTime) +
                (order.notes ? '<br>Instructions: ' + escapeHTML(order.notes) : '') + '</div><div class="order-foot"><strong>' + money(order.total) + '</strong><div class="button-row">' +
                (next ? '<button class="btn btn-primary btn-sm" onclick="advanceOrder(' + order.id + ')">' + next + '</button>' : '') +
                (order.status === "Pending" ? '<button class="btn btn-danger btn-sm" onclick="cancelStaffOrder(' + order.id + ')">Cancel</button>' : '') + '</div></div></article>';
        }
        return html;
    }
    function nextStatus(status) {
        if (status === "Pending") {
            return "Preparing";
        }
        if (status === "Preparing") {
            return "Ready for Pickup";
        }
        if (status === "Ready for Pickup") {
            return "Completed";
        }
        return "";
    }
    function advanceOrder(id) {
        if (!currentUser || currentUser.role === "student") {
            return;
        }
        var order = findOrder(id);
        if (!order) {
            return;
        }
        var next = nextStatus(order.status);
        if (!next) {
            return;
        }
        order.status = next;
        saveData();
        renderApp();
        showToast("Order #" + id + " is now " + next + ".");
    }
    function cancelStaffOrder(id) {
        if (!currentUser || currentUser.role === "student") {
            return;
        }
        var order = findOrder(id);
        if (!order || order.status !== "Pending") {
            return;
        }
        if (!confirm("Cancel order #" + id + "?")) {
            return;
        }
        order.status = "Cancelled";
        saveData();
        renderApp();
        showToast("Order #" + id + " cancelled.");
    }
    function changeStaffFilter(filter) {
        staffFilter = filter;
        renderApp();
    }
    // 9. Administrator food menu management
    function renderManageMenu() {
        var food = findFood(editingItemId);
        var heading = food ? "Edit Food Item" : "Add Food Item";
        var html = '<div class="page-intro"><span class="eyebrow">Administrator Tools</span><h1>Menu Management</h1>' +
            '<p>Add food, update prices, and control which items students can order.</p></div>' +
            '<div class="card" style="margin-bottom:20px"><h2>' + heading + '</h2><div class="divider"></div><form onsubmit="saveFoodItem(event)">' +
            '<div class="form-row"><div class="form-field"><label for="item-name">Food Name</label>' +
                '<input id="item-name" required maxlength="60" placeholder="e.g., Beef Tapa Rice" value="' + escapeHTML(food ? food.name : '') + '"></div>' +
            '<div class="form-field"><label for="item-price">Price (₱)</label>' +
                '<input id="item-price" type="number" min="1" max="10000" step="0.01" required placeholder="75.00" value="' + (food ? food.price : '') + '"></div></div>' +
            '<div class="form-row"><div class="form-field"><label for="item-category">Category</label><select id="item-category">';
        var categories = ["Meals", "Snacks", "Drinks", "Desserts"];
        for (var i = 0; i < categories.length; i++) {
            html += '<option value="' + categories[i] + '" ' + (food && food.category === categories[i] ? 'selected' : '') + '>' + categories[i] + '</option>';
        }
        html += '</select></div><div class="form-field"><label for="item-icon">Food Icon (Solar)</label>' +
            '<select id="item-icon"><option value="whisk">Meal / Utensil</option>' +
            '<option value="bag">Snack / Food Bag</option><option value="cup">Cup / Drink</option>' +
            '<option value="tea">Tea / Hot Drink</option><option value="donut">Dessert / Donut</option></select>' +
            '</div></div>' +
            '<div class="form-field"><label for="item-photo">Food Photo URL (HTTPS)</label>' +
            '<input id="item-photo" type="url" maxlength="400" placeholder="https://example.com/my-food-photo.jpg" ' +
            'value="' + escapeHTML(food ? foodPhoto(food) : '') + '" ' + (food ? '' : 'required') + '>' +
            '<small class="muted">Use a photo of the actual food. New items need a photo URL. ' +
            'Photos from Wikimedia Commons may require attribution.</small></div>' +
            '<div class="form-field"><label for="item-description">Description</label>' +
                '<textarea id="item-description" required maxlength="180" placeholder="Describe the food item">' + escapeHTML(food ? food.description : '') + '</textarea></div>' +
            '<div class="button-row"><button type="submit" class="btn btn-primary">' + (food ? 'Save Changes' : 'Add Food Item') + '</button>' +
            (food ? '<button type="button" class="btn btn-outline" onclick="clearFoodEditor()">Cancel Editing</button>' : '') + '</div></form></div>' +
            '<div class="card"><div class="section-head"><h2>Food Menu (' + menu.length + ')</h2></div><div class="table-wrap"><table><thead><tr><th>Food</th><th>Category</th><th>Price</th>' +
                '<th>Status</th><th>Actions</th></tr></thead><tbody>';
        for (var j = 0; j < menu.length; j++) {
            var item = menu[j];
            html += '<tr><td><span class="inline-photo">' + photoElement(item, 'admin-photo') + '</span> <strong>' + escapeHTML(item.name) + '</strong></td><td>' + escapeHTML(item.category) + '</td><td>' + money(item.price) + '</td><td>' +
                (item.available ? '<span class="status status-completed">Available</span>' : '<span class="status status-cancelled">Unavailable</span>') + '</td><td><div class="button-row">' +
                '<button class="btn btn-outline btn-sm" onclick="editFoodItem(' + item.id + ')">Edit</button>' +
                '<button class="btn ' + (item.available ? 'btn-danger' : 'btn-soft') + ' btn-sm" onclick="toggleFoodAvailability(' + item.id + ')">' + (item.available ? 'Disable' : 'Enable') + '</button></div></td></tr>';
        }
        html += '</tbody></table></div></div>';
        return html;
    }
    function selectSavedIcon() {
        var food = findFood(editingItemId);
        var input = document.getElementById("item-icon");
        if (food && input) {
            input.value = foodIcon(food);
        }
    }
    function saveFoodItem(event) {
        event.preventDefault();
        if (!currentUser || currentUser.role !== "admin") {
            return;
        }
        var name = document.getElementById("item-name").value.trim();
        var price = Number(document.getElementById("item-price").value);
        var category = document.getElementById("item-category").value;
        var selectedIcon = document.getElementById("item-icon").value;
        var description = document.getElementById("item-description").value.trim();
        var photoUrl = document.getElementById("item-photo").value.trim();
        if (!name || !description || !selectedIcon || !isFinite(price) || price < 1 || price > 10000) {
            showToast("Enter a valid food name, description, icon, and price.", true);
            return;
        }
        if (!/^https:\/\/[^\s\"'<>]+$/i.test(photoUrl)) {
            showToast("Enter a valid HTTPS photograph URL.", true);
            return;
        }
        if (editingItemId !== null) {
            var existing = findFood(editingItemId);
            if (!existing) {
                return;
            }
            existing.name = name;
            existing.price = price;
            existing.category = category;
            existing.icon = selectedIcon;
            existing.description = description;
            existing.photoUrl = photoUrl;
        }
        else {
            var newId = 1;
            for (var i = 0; i < menu.length; i++) {
                if (menu[i].id >= newId) {
                    newId = menu[i].id + 1;
                }
            }
            menu.push({
                id: newId,
                name: name,
                price: price,
                category: category,
                icon: selectedIcon,
                description: description,
                photoUrl: photoUrl,
                available: true
            });
        }
        editingItemId = null;
        saveData();
        renderApp();
        showToast("Food menu saved successfully.");
    }
    function editFoodItem(id) {
        if (!currentUser || currentUser.role !== "admin") {
            return;
        }
        editingItemId = id;
        renderApp();
        selectSavedIcon();
        window.scrollTo(0, 0);
        document.getElementById("item-name").focus();
    }
    function clearFoodEditor() {
        editingItemId = null;
        renderApp();
    }
    function toggleFoodAvailability(id) {
        if (!currentUser || currentUser.role !== "admin") {
            return;
        }
        var food = findFood(id);
        if (!food) {
            return;
        }
        food.available = !food.available;
        saveData();
        renderApp();
        showToast(food.name + (food.available ? " is now available." : " is now unavailable."));
    }
    // 10. My Profile: show account details and allow editing the name.
    // Each line adds one visible section to the page.
    function renderProfile() {
        var html = '<div class="page-intro">' +
            '<span class="eyebrow">Your Account</span>' +
            '<h1>My Profile</h1>' +
            '<p>View and update your demonstration account information.</p></div>';
        html += '<div class="card profile-card">' +
            '<div class="profile-header"><div class="avatar">' + initials(currentUser.name) + '</div>' +
            '<div><h2>' + escapeHTML(currentUser.name) + '</h2>' +
            '<div class="muted small" style="margin-top:5px;text-transform:capitalize">' +
            escapeHTML(currentUser.role) + ' Account</div></div></div>';
        html += '<form onsubmit="updateProfile(event)">' +
            '<div class="form-field"><label for="profile-name">Full Name</label>' +
            '<input id="profile-name" required maxlength="70" value="' + escapeHTML(currentUser.name) + '"></div>' +
            '<div class="form-field"><label>Email Address</label>' +
            '<input disabled value="' + escapeHTML(currentUser.email) + '"></div>';
        // Only students have student IDs; staff and admins do not see this field.
        if (currentUser.studentId) {
            html += '<div class="form-field"><label>Student ID</label>' +
                '<input disabled value="' + escapeHTML(currentUser.studentId) + '"></div>';
        }
        html += '<button class="btn btn-primary" type="submit">Save Profile</button></form>' +
            '<div class="divider"></div>' +
            '<button class="btn btn-outline" onclick="logout()">Sign Out</button></div>';
        return html;
    }
    function updateProfile(event) {
        event.preventDefault();
        var newName = document.getElementById("profile-name").value.trim();
        if (!newName) {
            showToast("Name cannot be empty.", true);
            return;
        }
        currentUser.name = newName;
        saveData();
        renderApp();
        showToast("Profile updated successfully.");
    }
    // 11. Start the application, including saved-session restoration.
    window.addEventListener("hashchange", function () {
        if (!currentUser) {
            return;
        }
        var requested = pageFromHash();
        currentPage = canOpenPage(requested) ? requested : "dashboard";
        renderApp();
    });
    // A sign-out in another tab immediately removes access in this tab.
    window.addEventListener("storage", function (event) {
        if (event.key === "uc_users_v1" && event.newValue) {
            try {
                var changedUsers = JSON.parse(event.newValue);
                if (Array.isArray(changedUsers)) {
                    users = changedUsers;
                }
            }
            catch (error) { /* Ignore invalid data from another tab. */ }
        }
        if ((event.key === SESSION_KEY || event.key === "uc_users_v1") && !temporarySession) {
            var restored = readDemoSession();
            if (!restored || !currentUser || restored.id !== currentUser.id) {
                currentUser = null;
                currentPage = "dashboard";
                renderApp();
            }
            else {
                currentUser = restored;
                if (!canOpenPage(currentPage)) {
                    currentPage = "dashboard";
                }
                scheduleSessionExpiry();
                renderApp();
            }
        }
    });
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            currentUser = readDemoSession();
            if (currentUser && !canOpenPage(currentPage)) {
                currentPage = "dashboard";
            }
            scheduleSessionExpiry();
            renderApp();
        }
    });
    document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible" && currentUser && !temporarySession) {
            renderApp();
        }
    });
    initializeApp();
  </script>
</body>
</html>
