<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#004C98">
  <title>UC Campus Canteen | Food Ordering</title>
  <style>
    :root {
      --blue: #004C98;
      --dark-blue: #003E93;
      --cyan: #00C6FE;
      --yellow: #FFF200;
      --background: #F3F5F9;
      --white: #FFFFFF;
      --text: #172033;
      --muted: #64748B;
      --border: #DFE7F1;
      --green: #16804A;
      --red: #C62828;
      --shadow: 0 12px 35px rgba(18, 50, 87, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #CAD5E4;
      border-radius: 10px;
      padding: 12px 13px;
      background: white;
      color: var(--text);
    }

    input:focus, select:focus, textarea:focus, button:focus-visible {
      outline: 3px solid rgba(0, 198, 254, .35);
      outline-offset: 2px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #35445D;
    }

    p {
      line-height: 1.55;
    }

    h1, h2, h3, h4 {
      line-height: 1.23;
    }

    h1 {
      font-size: 29px;
      margin: 5px 0 10px;
      letter-spacing: -0.5px;
    }

    h2 {
      font-size: 21px;
      margin: 0;
    }

    h3 {
      font-size: 17px;
      margin: 0;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      color: var(--blue);
    }

    .tiny-space {
      height: 12px;
    }

    .text-right {
      text-align: right;
    }

    .center {
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 17px;
      min-height: 43px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      transition: background .16s, transform .16s;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn-primary {
      color: white;
      background: var(--blue);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--dark-blue);
    }

    .btn-outline {
      background: white;
      color: var(--blue);
      border-color: #C6D6EA;
    }

    .btn-outline:hover:not(:disabled) {
      background: #F0F7FF;
    }

    .btn-soft {
      background: #E9F3FF;
      color: var(--blue);
    }

    .btn-danger {
      background: #FFF0F0;
      color: var(--red);
      border-color: #FFE0E0;
    }

    .btn-yellow {
      color: #172033;
      background: var(--yellow);
    }

    .btn-sm {
      min-height: 34px;
      padding: 8px 11px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-block {
      width: 100%;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .card {
      background: white;
      border: 1px solid #E8EDF4;
      border-radius: 17px;
      padding: 21px;
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 27px 0 16px;
    }

    .section-head:first-child {
      margin-top: 0;
    }

    .empty {
      background: white;
      padding: 44px 20px;
      border: 1px dashed #B9CEE5;
      border-radius: 16px;
      text-align: center;
    }

    .empty .big-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .empty h3 {
      margin-bottom: 6px;
    }

    .empty p {
      color: var(--muted);
      max-width: 440px;
      margin: 6px auto 19px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-field {
      margin-bottom: 16px;
    }

    .notice {
      padding: 12px 14px;
      border: 1px solid #BFDBFE;
      border-radius: 10px;
      background: #EFF7FF;
      color: #164B83;
      line-height: 1.5;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .status-pending {
      background: #FFF5D7;
      color: #795800;
    }

    .status-preparing {
      background: #E9F2FF;
      color: #0055A7;
    }

    .status-ready {
      background: #FFF5AE;
      color: #433B00;
    }

    .status-completed {
      background: #DDF6E7;
      color: #17653F;
    }

    .status-cancelled {
      background: #FBE4E4;
      color: #A72F2F;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 17px 0;
    }

    /* Welcome / Sign-in / Registration */
    .auth-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .auth-left {
      background: linear-gradient(145deg, #003E93 0%, #004C98 64%, #0075B5 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 48px clamp(30px, 7vw, 100px);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .auth-left::before {
      content: "";
      position: absolute;
      border: 80px solid rgba(0,198,254,.13);
      border-radius: 50%;
      width: 440px;
      height: 440px;
      right: -290px;
      top: 13%;
    }

    .auth-left::after {
      content: "";
      position: absolute;
      background: var(--yellow);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      right: 20%;
      bottom: 24%;
    }

    .auth-logo-box {
      display: inline-flex;
      background: white;
      border-radius: 13px;
      padding: 10px 14px;
      width: 154px;
      position: relative;
    }

    .uc-logo {
      width: 100%;
      display: block;
      object-fit: contain;
    }

    .auth-tag {
      margin-bottom: 25px;
      color: #92E7FF;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .auth-left h1 {
      font-size: clamp(35px, 4.5vw, 58px);
      max-width: 560px;
      line-height: 1.09;
      margin-bottom: 20px;
    }

    .auth-left .subline {
      max-width: 460px;
      color: #D7EDFF;
      font-size: 17px;
    }

    /* Center the message while keeping the UC logo in the upper-left corner. */
    .auth-intro {
      margin: auto 0;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .auth-features {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 35px;
    }

    .auth-feature {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.16);
      padding: 11px 13px;
      border-radius: 9px;
      font-size: 13px;
    }

    .auth-right {
      padding: 38px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-form-wrap {
      width: 100%;
      max-width: 430px;
    }

    .auth-form-wrap h2 {
      font-size: 29px;
      margin: 8px 0 9px;
    }

    .auth-form-wrap .intro {
      margin: 0 0 25px;
      color: var(--muted);
    }

    .auth-form-wrap .btn {
      margin-top: 3px;
    }

    .auth-link {
      border: 0;
      color: var(--blue);
      background: transparent;
      font-weight: 800;
      padding: 5px;
    }

    /* Main application layout */
    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      background: white;
      border-right: 1px solid var(--border);
      width: 253px;
      flex: 0 0 253px;
      padding: 23px 15px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 9px 21px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      width: 51px;
      height: 46px;
      flex: 0 0 51px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 9px;
      display: grid;
      place-items: center;
      padding: 3px;
    }

    .brand-name {
      color: var(--blue);
      font-weight: 900;
      letter-spacing: -.4px;
      font-size: 16px;
    }

    .brand-sub {
      display: block;
      font-size: 11px;
      font-weight: normal;
      color: var(--muted);
      margin-top: 3px;
    }

    .nav-caption {
      color: #8090A4;
      font-size: 10px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-weight: 800;
      margin: 24px 13px 9px;
    }

    .nav-button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 13px 13px;
      color: #52637C;
      border-radius: 10px;
      font-weight: 700;
      margin: 3px 0;
    }

    .nav-button .nav-icon {
      font-size: 18px;
      width: 22px;
      text-align: center;
    }

    .nav-button.active {
      background: #E8F3FF;
      color: var(--blue);
      box-shadow: inset 3px 0 var(--cyan);
    }

    .nav-button:hover:not(.active) {
      background: #F4F7FB;
      color: var(--blue);
    }

    .nav-count {
      margin-left: auto;
      background: var(--yellow);
      color: #172033;
      font-weight: 800;
      border-radius: 8px;
      padding: 2px 7px;
      font-size: 11px;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 18px;
    }

    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #F5F8FC;
      padding: 12px 10px;
      border-radius: 11px;
      margin-bottom: 7px;
    }

    .avatar {
      background: #DBECFF;
      color: var(--blue);
      border-radius: 11px;
      height: 35px;
      width: 35px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 13px;
      flex: 0 0 35px;
    }

    .sidebar-user strong {
      display: block;
      font-size: 12px;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-user small {
      color: var(--muted);
      text-transform: capitalize;
      font-size: 11px;
    }

    .main {
      flex: 1;
      min-width: 0;
    }

    .topbar {
      background: rgba(255,255,255,.98);
      height: 79px;
      border-bottom: 1px solid var(--border);
      padding: 0 34px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .topbar h2 {
      font-size: 18px;
    }

    .topbar .top-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .role-chip {
      background: #EDF6FF;
      color: var(--blue);
      border: 1px solid #D9E9FA;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 800;
      text-transform: capitalize;
    }

    .top-date {
      color: var(--muted);
      font-size: 12px;
    }

    .hamburger {
      display: none;
      background: white;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 11px;
    }

    .overlay {
      display: none;
    }

    .content {
      max-width: 1320px;
      margin: auto;
      padding: 29px 34px 70px;
    }

    .page-intro {
      margin-bottom: 22px;
    }

    .page-intro p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    /* Dashboard */
    .hero {
      background: linear-gradient(115deg, #004C98, #006BAB);
      border-radius: 19px;
      color: white;
      padding: 31px 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      width: 265px;
      height: 265px;
      position: absolute;
      right: -35px;
      top: -125px;
      border: 43px solid rgba(0,198,254,.19);
      border-radius: 50%;
    }

    .hero h1 {
      font-size: clamp(25px, 3vw, 34px);
      max-width: 510px;
    }

    .hero p {
      color: #D2E8FC;
      margin: 0 0 21px;
      max-width: 520px;
    }

    .hero .eyebrow {
      color: #9BF1FF;
    }

    .hero-emoji {
      font-size: 111px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 11px 12px rgba(0,0,0,.15));
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      margin: 18px 0 27px;
    }

    .stat {
      border: 1px solid var(--border);
      background: white;
      border-radius: 14px;
      padding: 18px 19px;
    }

    .stat strong {
      font-size: 27px;
      color: var(--blue);
      display: block;
      margin-top: 9px;
    }

    .stat span {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .stat-icon {
      font-size: 20px;
      float: right;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 17px;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 17px;
    }

    .step {
      display: flex;
      gap: 13px;
      align-items: center;
    }

    .step-number {
      height: 36px;
      width: 36px;
      flex: 0 0 36px;
      background: #E9F4FF;
      color: var(--blue);
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-weight: 900;
    }

    .step strong {
      font-size: 14px;
    }

    .step p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    /* Food menu */
    .menu-tools {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      flex-wrap: wrap;
      align-items: center;
      margin: 12px 0 17px;
    }

    .search-box {
      max-width: 360px;
      min-width: 220px;
      flex: 1;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid #CFDBEA;
      padding: 9px 13px;
      background: white;
      color: #52637C;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .chip.selected {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
    }

    .food-card {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #E3EAF3;
      background: white;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .food-picture {
      height: 160px;
      display: grid;
      place-items: center;
      font-size: 77px;
      position: relative;
      background: linear-gradient(140deg, #F0F8FF, #DBF2FF);
    }

    .food-picture.meals {
      background: linear-gradient(135deg, #E9F5FF, #D6EDFF);
    }

    .food-picture.snacks {
      background: linear-gradient(135deg, #FFF8E6, #FFECBA);
    }

    .food-picture.drinks {
      background: linear-gradient(135deg, #E7FBFF, #CDF3F9);
    }

    .food-picture.desserts {
      background: linear-gradient(135deg, #FFF0F4, #FFE1EC);
    }

    .food-picture span {
      filter: drop-shadow(0 6px 4px rgba(0, 0, 0, .11));
    }

    .food-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: white;
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 800;
      color: #516079;
    }

    .food-info {
      padding: 17px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .food-info h3 {
      font-size: 16px;
    }

    .food-info p {
      color: var(--muted);
      font-size: 12px;
      margin: 7px 0 16px;
      line-height: 1.5;
      flex: 1;
    }

    .food-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
    }

    .price {
      font-size: 20px;
      color: var(--blue);
      font-weight: 900;
      white-space: nowrap;
    }

    /* Cart, checkout, orders and tables */
    .cart-layout {
      display: grid;
      grid-template-columns: minmax(0,1fr) 320px;
      gap: 18px;
      align-items: start;
    }

    .cart-line {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-line:last-child {
      border-bottom: 0;
    }

    .line-image {
      width: 68px;
      height: 66px;
      flex: 0 0 68px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #EEF6FF;
      font-size: 36px;
    }

    .line-info {
      flex: 1;
      min-width: 0;
    }

    .line-info h3 {
      margin-bottom: 4px;
    }

    .line-info .muted {
      font-size: 12px;
    }

    .qty-controls {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 4px;
    }

    .qty-controls button {
      width: 26px;
      height: 27px;
      border: 0;
      border-radius: 6px;
      background: #EAF4FF;
      color: var(--blue);
      font-weight: 900;
    }

    .qty-controls span {
      min-width: 14px;
      text-align: center;
      font-weight: 800;
    }

    .line-price {
      text-align: right;
      min-width: 90px;
    }

    .line-price strong {
      display: block;
      margin-bottom: 9px;
    }

    .plain-link {
      background: none;
      border: 0;
      padding: 0;
      color: var(--red);
      text-decoration: underline;
      font-size: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 13px 0;
      gap: 12px;
    }

    .summary-total {
      font-size: 19px;
      font-weight: 900;
      color: var(--blue);
    }

    .order-card {
      padding: 20px;
      border-radius: 15px;
      border: 1px solid #E3EAF3;
      background: white;
      margin-bottom: 13px;
    }

    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 13px;
    }

    .order-head h3 {
      color: var(--blue);
    }

    .order-items {
      margin: 10px 0;
      color: #52637C;
      font-size: 13px;
      line-height: 1.7;
    }

    .order-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid var(--border);
    }

    .order-timeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 22px;
    }

    .timeline-step {
      text-align: center;
      position: relative;
    }

    .timeline-step .bubble {
      display: block;
      height: 29px;
      width: 29px;
      line-height: 29px;
      border-radius: 50%;
      background: #E8EDF4;
      color: #708195;
      margin: 0 auto 9px;
      font-size: 12px;
      font-weight: 900;
    }

    .timeline-step.done .bubble {
      background: var(--blue);
      color: white;
    }

    .timeline-step .caption {
      font-size: 10px;
      color: var(--muted);
    }

    .timeline-step.done .caption {
      color: var(--blue);
      font-weight: 800;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 14px 13px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
    }

    th {
      color: #6A7B90;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .inline-icon {
      font-size: 26px;
      vertical-align: middle;
    }

    .success-illustration {
      font-size: 60px;
      margin: 8px 0 9px;
    }

    .profile-card {
      max-width: 620px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 23px;
    }

    .profile-header .avatar {
      height: 56px;
      width: 56px;
      flex: 0 0 56px;
      font-size: 20px;
    }

    .filter-bar {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .staff-card {
      border-left: 4px solid var(--cyan);
    }

    #toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      max-width: min(400px, calc(100vw - 40px));
      padding: 13px 18px;
      border-radius: 11px;
      background: #133F72;
      color: white;
      box-shadow: 0 14px 28px rgba(0,0,0,.2);
      z-index: 100;
      display: none;
      line-height: 1.5;
    }

    #toast.error {
      background: #9D2832;
    }

    #toast.visible {
      display: block;
    }

    @media (max-width: 1080px) {
      .food-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .topbar, .content {
        padding-left: 24px;
        padding-right: 24px;
      }

      .two-col {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 800px) {
      .auth-page {
        grid-template-columns: 1fr;
      }

      .auth-left {
        min-height: 280px;
        padding: 30px 24px;
      }

      .auth-intro {
        margin: 28px 0 0;
      }

      .auth-left h1 {
        font-size: 36px;
      }

      .auth-features, .auth-bottom, .auth-left::before {
        display: none;
      }

      .auth-right {
        padding: 25px 20px 55px;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-110%);
        transition: transform .2s;
        box-shadow: 12px 0 35px rgba(0,0,0,.12);
      }

      body.menu-open .sidebar {
        transform: translateX(0);
      }

      body.menu-open .overlay {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.35);
        z-index: 19;
      }

      .hamburger {
        display: inline-block;
      }

      .topbar {
        padding: 0 17px;
        height: 70px;
      }

      .content {
        padding: 22px 16px 50px;
      }

      .top-date {
        display: none;
      }

      .hero {
        padding: 24px;
      }

      .hero-emoji {
        font-size: 70px;
      }

      .cart-layout {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 550px) {
      .food-grid {
        grid-template-columns: 1fr;
      }

      .stat-grid {
        grid-template-columns: 1fr 1fr;
      }

      .stat:last-child {
        grid-column: span 2;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .hero-emoji {
        display: none;
      }

      .hero {
        padding: 25px 21px;
      }

      .hero h1 {
        font-size: 27px;
      }

      .card {
        padding: 17px;
      }

      .cart-line {
        flex-wrap: wrap;
      }

      .line-price {
        margin-left: auto;
      }

      .topbar h2 {
        font-size: 16px;
      }

      .order-timeline .caption {
        font-size: 9px;
      }

      .role-chip {
        display: none;
      }

    }

    /* Solar icon system: inline SVG symbols keep everything offline. */
    .icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .solar-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      display: inline-block;
      vertical-align: middle;
    }

    .btn .solar-icon {
      width: 17px;
      height: 17px;
    }

    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
    }

    .nav-icon .solar-icon {
      width: 21px;
      height: 21px;
    }

    .auth-feature {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .auth-feature .solar-icon {
      width: 17px;
      height: 17px;
    }

    .hero-art {
      width: 156px;
      height: 156px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 38px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      transform: rotate(-9deg);
      position: relative;
      z-index: 1;
    }

    .hero-art .solar-icon {
      width: 105px;
      height: 105px;
      color: white;
      transform: rotate(9deg);
    }

    .stat-icon {
      display: inline-flex;
      float: right;
      color: var(--blue);
      background: #EFF7FF;
      border-radius: 11px;
      padding: 9px;
    }

    .stat-icon .solar-icon {
      width: 22px;
      height: 22px;
    }

    .food-picture {
      isolation: isolate;
    }

    .food-picture span {
      filter: none;
    }

    .food-picture::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 116px;
      height: 116px;
      border: 1px solid rgba(0,76,152,.13);
      border-radius: 30px;
      transform: rotate(25deg);
    }

    .food-picture span {
      width: 80px;
      height: 80px;
      display: grid;
      place-items: center;
      color: var(--blue);
    }

    .food-picture .solar-icon {
      width: 75px;
      height: 75px;
    }

    .food-picture.snacks span {
      color: #9B6308;
    }

    .food-picture.drinks span {
      color: #007C94;
    }

    .food-picture.desserts span {
      color: #AF4367;
    }

    .line-image .solar-icon {
      width: 38px;
      height: 38px;
      color: var(--blue);
    }

    .inline-icon .solar-icon {
      width: 23px;
      height: 23px;
      color: var(--blue);
    }

    .big-icon .solar-icon {
      width: 46px;
      height: 46px;
      color: var(--blue);
    }

    .search-field {
      position: relative;
      flex: 1;
      max-width: 360px;
      min-width: 220px;
    }

    .search-field > .solar-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #536680;
      width: 19px;
      height: 19px;
      pointer-events: none;
    }

    .search-field .search-box {
      min-width: 0;
      max-width: none;
      width: 100%;
      padding-left: 41px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .status .solar-icon {
      width: 15px;
      height: 15px;
    }

    .success-illustration {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 8px auto 18px;
      display: grid;
      place-items: center;
      background: #E1F6E9;
      color: var(--green);
    }

    .success-illustration .solar-icon {
      width: 58px;
      height: 58px;
    }

    .payment-icon {
      display: inline-flex;
      margin-right: 8px;
      vertical-align: middle;
    }

    .payment-icon .solar-icon {
      width: 17px;
      height: 17px;
    }

    .timeline-step .bubble .solar-icon {
      width: 18px;
      height: 18px;
    }

    .timeline-step .bubble {
      display: grid;
      place-items: center;
    }

    .hamburger {
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
    }

    .hamburger .solar-icon {
      width: 23px;
      height: 23px;
    }

    .food-card {
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .food-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 17px 34px rgba(18,50,87,.12);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0) scale(.99);
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid #0074B8;
      outline-offset: 3px;
    }

    @media (max-width: 800px) {
      .hamburger {
        display: inline-flex;
      }

      .hero-art {
        width: 110px;
        height: 110px;
        border-radius: 26px;
      }

      .hero-art .solar-icon {
        width: 68px;
        height: 68px;
      }

    }

    @media (max-width: 550px) {
      .hero-art {
        display: none;
      }

      .search-field {
        max-width: none;
        width: 100%;
      }

      .menu-tools > .btn {
        flex: 1;
      }

      .nav-button {
        min-height: 44px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }

    }

    /* Food photographs: lightweight responsive images, no animation libraries */
    .food-picture {
      position: relative;
      overflow: hidden;
      height: 178px;
      background: #EDF2F7;
    }

    .food-picture::after {
      display: none;
    }

    .food-picture > .photo-area {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .photo-area > img, .cart-photo > img, .admin-photo > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .food-picture > .photo-area > img {
      transition: transform .25s ease;
    }

    .food-card:hover .food-picture > .photo-area > img {
      transform: scale(1.035);
    }

    .photo-fallback {
      display: none;
      width: 100%;
      height: 100%;
      place-items: center;
      color: var(--blue);
      background: #EAF3FB;
    }

    .photo-fallback .solar-icon {
      width: 44px;
      height: 44px;
    }

    .no-photo .photo-fallback {
      display: grid;
    }

    .food-picture .photo-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    .food-picture .no-photo .photo-fallback {
      display: grid;
    }

    .food-picture .photo-fallback .solar-icon {
      width: 62px;
      height: 62px;
    }

    .food-tag {
      z-index: 1;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .08);
    }

    .line-image {
      padding: 0;
      overflow: hidden;
      background: #EDF4FA;
    }

    .cart-photo, .admin-photo {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .cart-photo .photo-fallback, .admin-photo .photo-fallback {
      position: absolute;
      inset: 0;
    }

    .inline-photo {
      width: 38px;
      height: 38px;
      display: inline-block;
      vertical-align: middle;
      overflow: hidden;
      border-radius: 8px;
      margin-right: 8px;
    }

    .photo-credits {
      max-width: 850px;
      margin: 11px auto 0;
      text-align: left;
      font-size: 11px;
    }

    .photo-credits summary {
      cursor: pointer;
      text-align: center;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .photo-credits p {
      text-align: center;
    }

    .photo-credits ul {
      columns: 2;
      padding-left: 22px;
      line-height: 1.8;
    }

    .photo-credits li {
      break-inside: avoid;
    }

    .photo-credits a {
      color: var(--blue);
    }

    @media (max-width: 600px) {
      .photo-credits ul {
        columns: 1;
      }

      .food-picture {
        height: 168px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      .food-picture > .photo-area > img {
        transition: none;
      }

      .food-card:hover .food-picture > .photo-area > img {
        transform: none;
      }

    }

    /* Dashboard refinements: food photos instead of the repeated whisk icon. */
    .hero-dish-collage {
      flex: 0 0 270px;
      width: 270px;
      height: 172px;
      position: relative;
      z-index: 1;
      margin-right: 4px;
    }

    .hero-dish-collage img {
      position: absolute;
      display: block;
      object-fit: cover;
      border: 5px solid rgba(255,255,255,.92);
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,30,68,.34);
    }

    .hero-dish-primary {
      width: 184px;
      height: 155px;
      right: 8px;
      top: 0;
      transform: rotate(7deg);
    }

    .hero-dish-secondary {
      width: 133px;
      height: 106px;
      left: 0;
      bottom: 0;
      transform: rotate(-12deg);
    }

    @media (max-width: 900px) {
      .hero-dish-collage {
        flex-basis: 205px;
        width: 205px;
        height: 145px;
      }

      .hero-dish-primary {
        width: 151px;
        height: 128px;
      }

      .hero-dish-secondary {
        width: 104px;
        height: 86px;
      }

    }

    @media (max-width: 650px) {
      .hero-dish-collage {
        display: none;
      }

    }

    .session-loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--blue);
    }
  </style>

    function saveData() {
        storageSet("uc_users_v1", JSON.stringify(users));
        storageSet("uc_menu_v1", JSON.stringify(menu));
        storageSet("uc_orders_v1", JSON.stringify(orders));
    }
    function findUser(id) {
        for (var i = 0; i < users.length; i++) {
            if (users[i].id === id) {
                return users[i];
            }
        }
        return null;
    }
    function findFood(id) {
        for (var i = 0; i < menu.length; i++) {
            if (menu[i].id === id) {
                return menu[i];
            }
        }
        return null;
    }
    function findOrder(id) {
        for (var i = 0; i < orders.length; i++) {
            if (orders[i].id === id) {
                return orders[i];
            }
        }
        return null;
    }
    function getMyOrders() {
        var result = [];
        for (var i = 0; i < orders.length; i++) {
            if (currentUser && orders[i].studentId === currentUser.id) {
                result.push(orders[i]);
            }
        }
        return result;
    }
    // Render a Solar icon. Shapes are stored in this HTML file above.
    function solarIcon(name, extraClass) {
        var names = ["bag", "whisk", "ladle", "chef", "donut", "cup", "tea", "cart", "orders",
            "user", "logout", "search", "hamburger", "check", "plus",
            "clock", "bell"];
        if (names.indexOf(name) === -1) {
            name = "bag";
        }
        return '<svg class="solar-icon ' + (extraClass || "") +
            '" aria-hidden="true" focusable="false"><use href="#si-' + name + '"></use></svg>';
    }
    // Pick the appropriate icon for older menu data saved by the previous version.
    function foodIcon(food) {
        if (food.icon) {
            return food.icon;
        }
        if (food.category === "Drinks") {
            return "cup";
        }
        if (food.category === "Desserts") {
            return "donut";
        }
        if (food.category === "Snacks") {
            return "bag";
        }
        return "whisk";
    }

    function samplePhotoFor(food) {
        // The default demo IDs stay the same even if a previous menu was saved.
        var index = food.id - 1;
        if (index >= 0 && index < samplePhotos.length) {
            return photoAddress(samplePhotos[index].file);
        }
        return "";
    }
    function photoAddress(fileName) {
        return "https://commons.wikimedia.org/wiki/Special:FilePath/" +
            encodeURIComponent(fileName.replace(/ /g, "_")) + "?width=700";
    }
    function foodPhoto(food) {
        if (food.photoUrl && /^https:\/\/[^\s"'<>]+$/i.test(food.photoUrl)) {
            return food.photoUrl;
        }
        return samplePhotoFor(food);
    }
    // Use the same photo in food cards, shopping cart, and menu management.
    function photoElement(food, className) {
        var source = foodPhoto(food);
        var fallback = '<span class="photo-fallback" aria-hidden="true">' +
            solarIcon(foodIcon(food)) + '</span>';
        if (!source) {
            return '<div class="' + className + ' no-photo">' + fallback + '</div>';
        }
        return '<div class="' + className + '"><img src="' + escapeHTML(source) +
            '" alt="' + escapeHTML(food.name) + ' food photograph" loading="lazy" ' +
            'decoding="async" referrerpolicy="no-referrer" ' +
            'onerror="this.style.display=&quot;none&quot;;this.nextElementSibling.style.display=&quot;grid&quot;">' +
            fallback + '</div>';
    }
    function money(amount) {
        return "₱" + Number(amount).toFixed(2);
    }
    function formatDate(dateText) {
        return new Date(dateText).toLocaleString("en-PH", {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit"
        });
    }
    function escapeHTML(text) {
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function initials(name) {
        var words = name.trim().split(" ");
        return (words[0].charAt(0) + (words.length > 1 ? words[words.length - 1].charAt(0) : "")).toUpperCase();
    }
    function showToast(message, isError) {
        var toast = document.getElementById("toast");
        toast.textContent = message;
        toast.setAttribute("role", isError ? "alert" : "status");
        toast.className = "visible" + (isError ? " error" : "");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(function () { toast.className = ""; }, 3500);
    }
    function cartCount() {
        var count = 0;
        for (var i = 0; i < cart.length; i++) {
            count += cart[i].quantity;
        }
        return count;
    }
    function cartTotal() {
        var total = 0;
        for (var i = 0; i < cart.length; i++) {
            var item = findFood(cart[i].foodId);
            if (item) {
                total += item.price * cart[i].quantity;
            }
        }
        return total;
    }
    // 3. Browser-only account checks and demonstration session restoration.
    // These checks do NOT replace a server-side authentication provider.
    function hexToBytes(hex) {
        var bytes = new Uint8Array(hex.length / 2);
        for (var i = 0; i < bytes.length; i++) {
            bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        }
        return bytes;
    }
    function bytesToHex(bytes) {
        var result = "";
        for (var i = 0; i < bytes.length; i++) {
            result += bytes[i].toString(16).padStart(2, "0");
        }
        return result;
    }
    function makePasswordSalt() {
        var bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        return bytesToHex(bytes);
    }
    // PBKDF2 prevents saving passwords as plain text in localStorage.
    async function hashPassword(password, salt) {
        if (!window.crypto || !crypto.subtle) {
            throw new Error("Password protection requires a secure browser context.");
        }

    // Upgrade existing accounts without deleting their orders or profile information.
    async function upgradeOldPasswords() {
        var changed = false;
        for (var i = 0; i < users.length; i++) {
            if (typeof users[i].password === "string") {
                var salt = makePasswordSalt();
                users[i].passwordHash = await hashPassword(users[i].password, salt);
                users[i].passwordSalt = salt;
                delete users[i].password;
                changed = true;
            }
        }
        if (changed && !storageSet("uc_users_v1", JSON.stringify(users))) {
            throw new Error("Unable to save the upgraded account records.");

    // A saved session remembers only a user ID and expiration time.
    // It does NOT contain a password. The browser checks it at page startup.
    function readDemoSession() {
        var record;
        try {
            record = JSON.parse(storageGet(SESSION_KEY) || "null");
        }
        catch (error) {
            record = null;
        }
        var now = Date.now();
        if (!record || record.version !== 2 ||
            !Number.isInteger(record.userId) ||
            !Number.isFinite(record.issuedAt) ||
            !Number.isFinite(record.expiresAt) ||
            record.issuedAt > now || record.expiresAt <= now ||
            record.expiresAt <= record.issuedAt ||
            record.expiresAt - record.issuedAt > SESSION_DURATION) {
            storageRemove(SESSION_KEY);
            return null;
        }
        var user = findUser(record.userId);
        if (!user || user.disabled === true ||
            ["student", "staff", "admin"].indexOf(user.role) === -1 ||
            !user.passwordHash) {
            storageRemove(SESSION_KEY);
            return null;
        }
        // Identity and role are taken from the current account record,
        // never from the saved session marker itself.
        return user;

    function rememberDemoUser(user) {
        var now = Date.now();
        temporarySession = !storageSet(SESSION_KEY, JSON.stringify({

            expiresAt: now + SESSION_DURATION

    // A single timeout checks expiry while the app stays open.
    function scheduleSessionExpiry() {
        if (sessionExpiryTimer) {
            clearTimeout(sessionExpiryTimer);
        }
        sessionExpiryTimer = null;
        if (temporarySession) {
            return;
        }
        var record;
        try {
            record = JSON.parse(storageGet(SESSION_KEY) || "null");
        }
        catch (error) {
            return;
        }
        if (!record || !Number.isFinite(record.expiresAt)) {
            return;
        }
        sessionExpiryTimer = setTimeout(function () {
            if (currentUser && !readDemoSession()) {
                currentUser = null;
                currentPage = "dashboard";
                authPage = "login";
                renderApp();
                showToast("Your demonstration session expired. Please sign in again.", true);
            }

    function canOpenPage(page) {
        if (!currentUser) {
            return false;
        }
        var studentPages = ["menu", "cart", "checkout", "confirmation", "orders", "order-details"];
        if (studentPages.indexOf(page) !== -1) {
            return currentUser.role === "student";
        }
        if (page === "staff-orders") {
            return currentUser.role === "staff" || currentUser.role === "admin";
        }
        if (page === "manage-menu") {
            return currentUser.role === "admin";
        }

    // 3. User registration and sign-in (demo only)
    // Login steps: read fields, find an account, check its password hash,
    // remember the account for this browser, and show its dashboard.
    // hashPassword() uses Web Crypto because saving plaintext passwords is unsafe.
    async function login(event) {
        event.preventDefault();
        var email = document.getElementById("login-email").value.trim().toLowerCase();
        var passwordField = document.getElementById("login-password");
        var password = passwordField.value;
        var button = event.target.querySelector('button[type="submit"]');
        button.disabled = true;
        try {
            for (var i = 0; i < users.length; i++) {
                if (users[i].email.toLowerCase() !== email || !users[i].passwordHash) {
                    continue;
                }
                var candidateHash = await hashPassword(password, users[i].passwordSalt);
                if (candidateHash === users[i].passwordHash && users[i].disabled !== true) {
                    currentUser = users[i];
                    rememberDemoUser(currentUser);
                    cart = [];
                    currentPage = pageFromHash();
                    if (!canOpenPage(currentPage)) {
                        currentPage = "dashboard";
                    }
                    passwordField.value = "";
                    renderApp();
                    showToast("Signed in as " + currentUser.name + ".");
                    if (temporarySession) {
                        showToast("Browser storage is blocked; sign-in will not persist.", true);
                    }
                    return;
                }
            }
            showToast("Incorrect email or password. Please try again.", true);
        }
        catch (error) {
            showToast("Could not verify your password in this browser.", true);
        }
        finally {
            button.disabled = false;
        }
    }
    async function register(event) {
        event.preventDefault();
        var name = document.getElementById("register-name").value.trim();
        var studentId = document.getElementById("register-id").value.trim();
        var email = document.getElementById("register-email").value.trim().toLowerCase();
        var password = document.getElementById("register-password").value;
        var confirmPassword = document.getElementById("register-confirm").value;
        if (!name || !studentId || !email || !password) {
            showToast("Please complete all fields.", true);
            return;
        }
        if (password.length < 6) {
            showToast("Password must have at least 6 characters.", true);
            return;
        }
        if (password !== confirmPassword) {
            showToast("Passwords do not match.", true);
            return;
        }
        for (var i = 0; i < users.length; i++) {
            if (users[i].email.toLowerCase() === email || users[i].studentId === studentId) {
                showToast("Email or Student ID is already registered.", true);
                return;
            }
        }
        var newId = 1;
        for (var j = 0; j < users.length; j++) {
            if (users[j].id >= newId) {
                newId = users[j].id + 1;
            }
        }
        var button = event.target.querySelector('button[type="submit"]');
        button.disabled = true;
        var passwordSalt;
        var passwordHash;
        try {
            passwordSalt = makePasswordSalt();
            passwordHash = await hashPassword(password, passwordSalt);
        }
        catch (error) {
            button.disabled = false;
            showToast("Could not protect your password in this browser.", true);
            return;
        }
        users.push({
            id: newId,
            name: name,
            studentId: studentId,
            email: email,
            passwordSalt: passwordSalt,
            passwordHash: passwordHash,
            role: "student"
        });
        saveData();
        authPage = "login";
        renderApp();
        showToast("Registration successful! Sign in with your new account.");
    }
    function logout() {
        storageRemove(SESSION_KEY);
        if (sessionExpiryTimer) {
            clearTimeout(sessionExpiryTimer);
        }
        sessionExpiryTimer = null;
        temporarySession = false;
        currentUser = null;
        cart = [];
        lastOrderId = null;
        selectedOrderId = null;
        selectedCategory = "All";

        staffFilter = "All";
        editingItemId = null;
        currentPage = "dashboard";
        authPage = "login";
        document.body.classList.remove("menu-open");

            history.replaceState(null, "", location.pathname + location.search);
        }
        catch (error) { /* Continue with sign-out even if URL replacement fails. */ }
        renderApp();
        showToast("You have signed out.");
    }
